name: Audios ingleses (Wings of Freedom y The Chosen One)

on:
  workflow_dispatch:

jobs:
  audios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg y Edge TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade edge-tts
      - name: Generar audios en inglés
        env:
          EDGE_VOICE_EN: en-US-GuyNeural
          EDGE_RATE: "-5%"
        run: python scripts/generar_audios_en.py alasdelibertad-en.html elelegido-en.html
      - name: Guardar cambios
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🎙️ Audios en inglés: Wings of Freedom y The Chosen One"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
