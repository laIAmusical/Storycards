name: Audios de storycards (español o inglés)

on:
  workflow_dispatch:
    inputs:
      paginas:
        description: 'Páginas separadas por espacios (el idioma se detecta solo)'
        required: true
        default: 'semilladeluz.html eldestino.html elgritoenelespacio.html'

jobs:
  audios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ffmpeg y Edge TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade edge-tts
      - name: Generar audios
        env:
          EDGE_VOICE_ES: es-ES-AlvaroNeural
          EDGE_VOICE_EN: en-US-GuyNeural
          EDGE_RATE: "-5%"
          PAGINAS: ${{ github.event.inputs.paginas }}
        run: python scripts/generar_audios.py $PAGINAS
      - name: Guardar cambios
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🎙️ Audios de storycards: ${{ github.event.inputs.paginas }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
