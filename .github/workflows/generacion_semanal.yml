name: Automatización Semanal Storycards

on:
  schedule:
    - cron: '0 0 * * 1' # Todos los lunes a las 00:00 UTC
  workflow_dispatch:     # Permite la ejecución manual desde la pestaña Actions

jobs:
  generar-contenido:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Permite al bot hacer commit y push automático de los cambios

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Escribir 2 historias épicas con Gemini y crear las storycards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUM_CAPITULOS: 5          # capítulos por historia (3 a 8)
          PALABRAS_CAPITULO: 170    # palabras aproximadas por capítulo
        run: node scripts/generador_semanal.js

      - name: Guardar y sincronizar cambios automáticamente en GitHub
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "🤖 Nuevas storycards épicas generadas con Gemini"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
