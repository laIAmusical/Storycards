name: Automatización Semanal Storycards y Multimedia

on:
  schedule:
    - cron: '0 0 * * 1' # Todos los lunes a las 00:00 UTC
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  generar-contenido:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que el robot haga commit y push de los nuevos audios y archivos

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar script de generación de tarjetas, voz y música
        run: node scripts/generador_semanal.js

      - name: Guardar y sincronizar cambios automáticamente en GitHub
        run: |
          git config --global user.name "Bot Automático de Storycards"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/storycards.json storycard/assets/audio/
          git commit -m "🤖 Generación automática de 2 Storycards, voz y música ambiental"
          git push
