name: Automatización Semanal Storycards

on:
  schedule:
    - cron: '0 0 * * 1' # Todos los lunes a las 00:00 UTC
  workflow_dispatch:     # Permite la ejecución manual desde la pestaña Actions

jobs:
  generar-contenido:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Permite al bot hacer commit y push automático de los cambios

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Python (para Edge TTS)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Voz principal del narrador: Microsoft Edge TTS (voces neuronales, gratis, sin clave).
      - name: Instalar Edge TTS
        continue-on-error: true
        run: python -m pip install --upgrade edge-tts

      # Voz de RESPALDO: Piper corre dentro del runner (gratis, sin claves y sin límites).
      # Solo se usa si Microsoft bloquea a Edge TTS en esta ejecución.
      - name: Instalar voz de respaldo (Piper + voz masculina en español)
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/piper-voz"
          cd "$RUNNER_TEMP/piper-voz"
          curl -fsSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -fsSL -o voz.onnx "$BASE/es_ES-davefx-medium.onnx"
          curl -fsSL -o voz.onnx.json "$BASE/es_ES-davefx-medium.onnx.json"
          echo "PIPER_BIN=$RUNNER_TEMP/piper-voz/piper/piper" >> "$GITHUB_ENV"
          echo "PIPER_MODEL=$RUNNER_TEMP/piper-voz/voz.onnx" >> "$GITHUB_ENV"

      - name: Escribir historias épicas con Gemini y crear las storycards
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          NUM_CAPITULOS: 10
          PALABRAS_CAPITULO: 250
          EDGE_VOICE: es-ES-AlvaroNeural   # voz masculina de España
          EDGE_VOICE_EN: en-US-GuyNeural   # voz masculina en inglés
          EDGE_RATE: "-5%"                 # velocidad de lectura
        run: node scripts/generador_semanal.js

      - name: Guardar y sincronizar cambios automáticamente en GitHub
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "🤖 Nuevas storycards épicas bilingües (ES/EN) (historia, imágenes y voz)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
