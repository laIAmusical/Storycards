name: Imágenes de capítulos de una storycard

on:
  workflow_dispatch:
    inputs:
      storycard:
        description: 'Páginas de las storycards, separadas por espacios (ej: eldestino.html elavesinjaula.html)'
        required: true
        default: 'eldestino.html'
      forzar:
        description: 'Regenerar aunque ya existan las imágenes'
        type: boolean
        default: false

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar ffmpeg (recorte exacto)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generar imágenes de los capítulos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STORYCARD: ${{ github.event.inputs.storycard }}
          FORZAR: ${{ github.event.inputs.forzar }}
        run: |
          if [ "$FORZAR" = "true" ]; then EXTRA="--force"; else EXTRA=""; fi
          node scripts/generar_imagenes_storycard.js "$STORYCARD" $EXTRA

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🖼️ Imágenes de capítulos: ${{ github.event.inputs.storycard }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
