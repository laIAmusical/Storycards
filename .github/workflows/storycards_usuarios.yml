name: Storycards de usuarios (texto → historia, imágenes, voces, secretos y quiz)

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas busca cartas pendientes
  workflow_dispatch:         # o ejecútalo a mano desde la pestaña Actions

# Evita que dos ejecuciones procesen las mismas cartas a la vez
concurrency:
  group: storycards-usuarios
  cancel-in-progress: false

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # firebase-admin se instala FUERA del repositorio para que "git add -A" no suba node_modules
      - name: Instalar firebase-admin
        run: |
          npm install --prefix "$RUNNER_TEMP/fb" firebase-admin
          echo "NODE_PATH=$RUNNER_TEMP/fb/node_modules" >> "$GITHUB_ENV"

      - name: Contar cartas de usuario pendientes
        id: contar
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/procesar_storycards_usuario.js --contar

      - name: Configurar Python (para Edge TTS)
        if: steps.contar.outputs.pendientes != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ffmpeg (recorte exacto de imágenes)
        if: steps.contar.outputs.pendientes != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Edge TTS
        if: steps.contar.outputs.pendientes != '0'
        continue-on-error: true
        run: python -m pip install --upgrade edge-tts

      - name: Instalar voz de respaldo (Piper + voz masculina en español)
        if: steps.contar.outputs.pendientes != '0'
        continue-on-error: true
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/piper-voz"
          cd "$RUNNER_TEMP/piper-voz"
          curl -fsSL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium
          curl -fsSL -o voz.onnx "$BASE/es_ES-davefx-medium.onnx"
          curl -fsSL -o voz.onnx.json "$BASE/es_ES-davefx-medium.onnx.json"
          echo "PIPER_BIN=$RUNNER_TEMP/piper-voz/piper/piper" >> "$GITHUB_ENV"
          echo "PIPER_MODEL=$RUNNER_TEMP/piper-voz/voz.onnx" >> "$GITHUB_ENV"

      - name: Crear las storycards de usuario
        if: steps.contar.outputs.pendientes != '0'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOLO_CLOUDFLARE: 1   # imágenes solo con Cloudflare (sin Pollinations)
          EDGE_VOICE: es-ES-AlvaroNeural
          EDGE_VOICE_EN: en-US-GuyNeural
          EDGE_RATE: "-5%"
          MAX_HISTORIAS: 3
          RESULTADOS_PATH: ${{ runner.temp }}/usuarios_resultados.json
        run: node scripts/procesar_storycards_usuario.js

      - name: Guardar y sincronizar cambios en GitHub
        id: guardar
        if: steps.contar.outputs.pendientes != '0'
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "🤖 Storycards de usuarios (historia, imágenes, voces, quiz y secretos ES/EN)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Solo se marcan como hechas en Firestore si el push salió bien
      - name: Marcar resultado en Firestore
        if: steps.contar.outputs.pendientes != '0' && steps.guardar.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESULTADOS_PATH: ${{ runner.temp }}/usuarios_resultados.json
        run: node scripts/procesar_storycards_usuario.js --marcar
