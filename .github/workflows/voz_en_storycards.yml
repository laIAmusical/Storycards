name: Voz inglesa Valen-Kael y Selene-Voris (una sola vez)

on:
  workflow_dispatch:

jobs:
  voz:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade edge-tts
      - run: python scripts/generar_voz_en.py thelastvoyageofvalenkael-en
      - run: python scripts/generar_voz_en.py thedarkawakeningofselenevoris-en
      - name: Guardar cambios
        run: |
          git config user.name "Bot Automático de Storycards"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "🎙️ Narración en inglés (Valen-Kael y Selene-Voris)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
