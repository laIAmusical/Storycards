<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca LaIAmusical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-brown:#A0522D;--dark-brown:#8B4513;--light-tan:#D2B48C;--primary-red:#8B0000;
            --dark-red:#4B0000;--primary-orange:#FF8C00;--dark-orange:#E67E22;--primary-purple:#4B0082;
            --dark-purple:#2E0854;--primary-crimson:#C00000;--dark-crimson:#800000;--primary-violet:#6B46C1;
            --dark-violet:#4C1D95;--star-gold:#FFD700;--bg-light:#f8f8f8;--bg-dark:#1a1a1a;
            --disabled-grey:#ccc;--ia-blue:#007bff;
        }
        /* Fondo de página: imagen fondo3.png (guárdala como images/fondo3.png).
           Se dibuja en un pseudo-elemento fijo para que cubra siempre toda la pantalla (también en móviles)
           y html lleva un color oscuro de respaldo, así nunca asoma fondo blanco. */
        html { background-color:#050514; min-height:100%; }
        body { font-family:'Segoe UI',Arial,sans-serif; margin:20px; background:transparent; color:#333; min-height:100vh; }
        body::before { content:''; position:fixed; inset:0; z-index:-1; background:#050514 url('images/fondo3.png') no-repeat center center; background-size:cover; }
        .biblioteca-view .container { max-width:900px; margin:0 auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
        .header-wrapper { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; gap:12px; }
        .biblioteca-view h1 { color:#0056b3; text-align:center; flex-grow:1; margin:0; }
        .temas-btn { background-color:#BEF264; color:#1a1a1a; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:bold; border:1px solid #a7e555; transition:0.3s; }
        .temas-btn:hover { background-color:#a7e555; transform:scale(1.05); }
        
        /* ── DISEÑO DE RECUADROS DE SALAS ── */
        .bib-salas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
            list-style: none;
            padding: 0;
        }

        .bib-sala-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
            padding: 25px 15px;
            border-radius: 10px;
            border: 1px solid rgba(20, 184, 166, 0.5);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .bib-sala-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(20, 184, 166, 0.4);
            border-color: #14b8a6;
        }

        .bib-sala-count {
            display: inline-block;
            margin-top: 15px;
            font-size: 0.8rem;
            color: #cbd5e1;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Tipografía y estilos de las etiquetas de las salas */
        .sala-label { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; }
        .sala-title {
            line-height: 1.3; text-align: center; margin: 0;
            font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700;
            font-size: 1.3rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .sala-line { width: 50px; height: 2px; border-radius: 2px; margin-top: 8px; }

        /* Colores específicos por categoría */
        .sala-label--children .sala-title { color: #ff8f6e; }
        .sala-label--children .sala-line { background: linear-gradient(90deg, transparent, #e05c3a, transparent); }

        .sala-label--animation .sala-title { color: #5b9bff; }
        .sala-label--animation .sala-line { background: linear-gradient(90deg, transparent, #3a7de0, transparent); }

        .sala-label--adults .sala-title { color: #e8cd8f; }
        .sala-label--adults .sala-line { background: linear-gradient(90deg, transparent, #9b7e46, transparent); }

        .sala-label--suspense .sala-title { color: #b28ee0; }
        .sala-label--suspense .sala-line { background: linear-gradient(90deg, transparent, #8b5fc4, transparent); }

        .sala-label--liveaction .sala-title { color: #5cd3f0; }
        .sala-label--liveaction .sala-line { background: linear-gradient(90deg, transparent, #3abfe0, transparent); }

        .sala-label--science .sala-title { color: #6fdba0; }
        .sala-label--science .sala-line { background: linear-gradient(90deg, transparent, #4fb87a, transparent); }

        .search-container { margin:25px 0; display:flex; gap:10px; }
        #search-input { flex-grow:1; padding:12px; border:1px solid #ddd; border-radius:8px; outline:none; }
        .search-btn { padding:10px 25px; background-color:#28a745; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
        .result-item { padding:15px; border-bottom:1px solid #eee; cursor:pointer; }
        .result-item:hover { background-color:#f8fbff; }
        hr { border:0; border-top:1px solid #eee; margin:30px 0; }
        .sala-view { background-color:var(--bg-light); color:#333; }
        .sala-view .container { max-width:950px; margin:0 auto; background:#fff; padding:30px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
        .sala-view h1 { text-align:center; border-bottom:3px solid; padding-bottom:15px; margin-top:0; margin-bottom:20px; font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; font-size: 1.8rem;}
        .header-links { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
        .back-link { text-decoration:none; color:#007bff; font-weight:bold; }
        .info-panel { padding:20px; border-radius:8px; margin-bottom:25px; border:1px solid; text-align:center; font-weight:bold; }
        .ia-notice { display:block; margin-top:10px; font-size:0.95em; border-top:1px solid; padding-top:10px; }
        .entrada-item { display:flex; justify-content:space-between; align-items:center; padding:20px; margin:10px 0; border-radius:10px; border:1px solid #eee; background-color:#fff; }
        .titulo-autor { flex-grow:1; text-align:left; }
        .titulo-original { font-size:1.1em; font-weight:bold; color:#444; display:block; }
        .autor { font-size:0.9em; color:#777; font-style:italic; display:block; margin-top:5px; }
        .storycard-category { color:var(--ia-blue); font-size:0.82em; font-weight:600; display:block; margin-top:6px; }
        .synopsis-text { font-size:0.82em; color:#888; display:block; margin-top:6px; line-height:1.45; font-style:normal; }
        .storycard-img { width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid #ddd; background:#f4f4f4; flex-shrink:0; }
        .item-info-wrapper { display:flex; gap:15px; align-items:center; flex-grow:1; }
        .controles-votacion { display:flex; flex-direction:column; gap:10px; align-items:flex-end; min-width:200px; justify-content:center; }
        .vote-stats { display:flex; flex-direction:column; font-size:0.85em; padding:8px 12px; border-radius:8px; border:1px solid; text-align:center; }
        .rating-avg { color:var(--star-gold); font-weight:800; }
        .voted-badge { color:#10b981; font-weight:600; }
        .not-voted-badge { color:#999; font-weight:400; }
        
        /* Estilos por colores para la vista interior de la sala */
        .sala-literaria h1 { color:var(--primary-brown); border-bottom-color:var(--primary-brown); }
        .sala-literaria .info-panel { background:#fff8e1; border-color:#ffe082; }
        .sala-literaria .ia-notice { color:#856404; border-top-color:#ffe082; }
        .sala-literaria .vote-stats { background:#f0f7ff; border-color:#d0e0f0; }
        .sala-cine h1 { color:var(--primary-red); border-bottom-color:var(--primary-red); }
        .sala-cine .info-panel { background:#fff5f5; border-color:#ffcccc; }
        .sala-cine .ia-notice { color:var(--primary-red); border-top-color:#ffcccc; }
        .sala-cine .vote-stats { background:#fff9e6; border-color:#ffeeba; }
        .sala-animacion h1 { color:var(--primary-orange); border-bottom-color:var(--primary-orange); }
        .sala-animacion .info-panel { background:#fff9f0; border-color:#ffe0b2; }
        .sala-animacion .ia-notice { color:#e65100; border-top-color:#ffe0b2; }
        .sala-animacion .vote-stats { background:#fffdf5; border-color:#fff3e0; }
        .sala-opera h1 { color:var(--primary-purple); border-bottom-color:var(--primary-purple); }
        .sala-opera .info-panel { background:#f3e5f5; border-color:#d1c4e9; }
        .sala-opera .ia-notice { color:var(--primary-purple); border-top-color:#d1c4e9; }
        .sala-opera .vote-stats { background:#f8f0ff; border-color:#e1bee7; }
        .sala-teatro { background-color:var(--bg-dark); color:#eee; }
        .sala-teatro .container { background:#2b2b2b; }
        .sala-teatro h1 { color:var(--primary-crimson); border-bottom-color:var(--primary-crimson); text-transform:uppercase; letter-spacing:2px; }
        .sala-teatro .info-panel { background:#3d0000; border-color:var(--primary-crimson); color:#ffcccc; }
        .sala-teatro .entrada-item { border-color:#444; background-color:#333; }
        .sala-teatro .vote-stats { background:#444; }
        .sala-teatro .back-link { color:var(--ia-blue); }
        .sala-teatro .titulo-original { color:#fff; }
        .sala-extras h1 { color:var(--primary-violet); border-bottom-color:var(--primary-violet); }
        .sala-extras .info-panel { background:#f3e8ff; border-color:#d8b4fe; }
        .sala-extras .ia-notice { color:var(--primary-violet); border-top-color:#d8b4fe; }
        .sala-extras .vote-stats { background:#f3e8ff; border-color:#d8b4fe; }
        .sala-anime h1 { color:var(--primary-purple); border-bottom-color:var(--primary-purple); }
        .sala-anime .info-panel { background:#f3e5f5; border-color:#d1c4e9; }
        .sala-anime .ia-notice { color:var(--primary-purple); border-top-color:#d1c4e9; }
        .sala-anime .vote-stats { background:#f8f0ff; border-color:#e1bee7; }
        .sala-series h1 { color:var(--dark-red); border-bottom-color:var(--dark-red); }
        .sala-series .info-panel { background:#fff5f5; border-color:#ffcccc; }
        .sala-series .ia-notice { color:var(--dark-red); border-top-color:#ffcccc; }
        .sala-series .vote-stats { background:#fff9e6; border-color:#ffeeba; }
        .sala-videojuegos h1 { color:#1e40af; border-bottom-color:#1e40af; }
        .sala-videojuegos .info-panel { background:#eff6ff; border-color:#bfdbfe; }
        .sala-videojuegos .ia-notice { color:#1e40af; border-top-color:#bfdbfe; }
        .sala-videojuegos .vote-stats { background:#eff6ff; border-color:#bfdbfe; }
        .sala-usuarios h1 { color:#0f766e; border-bottom-color:#0f766e; }
        .sala-usuarios .info-panel { background:#ecfdf5; border-color:#a7f3d0; }
        .sala-usuarios .ia-notice { color:#0f766e; border-top-color:#a7f3d0; }
        .sala-usuarios .vote-stats { background:#ecfdf5; border-color:#a7f3d0; }
        
        @media (max-width:600px) {
            .entrada-item { flex-direction:column; text-align:center; }
            .item-info-wrapper { flex-direction:column; }
            .controles-votacion { margin-top:15px; width:100%; justify-content:center; }
        }
        .buy-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:9px 16px; border:none; border-radius:8px; cursor:pointer; background:linear-gradient(135deg,#0d9488,#0891b2); color:#fff; font-weight:bold; font-size:0.85em; transition:all 0.25s ease; box-shadow:0 3px 8px rgba(13,148,136,0.35); }
        .buy-btn:hover { transform:translateY(-2px); box-shadow:0 6px 14px rgba(13,148,136,0.5); }
        .buy-btn .fa-gem { color:#bfdbfe; }
        .owned-badge { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-weight:bold; font-size:0.82em; color:#047857; background:#d1fae5; border:1px solid #6ee7b7; }
        .sala-teatro .owned-badge { color:#6ee7b7; background:#064e3b; border-color:#047857; }
        .coleccion-btn { background-color:#5eead4; border-color:#2dd4bf; white-space:nowrap; }
        .coleccion-btn:hover { background-color:#2dd4bf; }
        .header-buttons { display:flex; gap:10px; align-items:center; }
        .buy-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; display:none; justify-content:center; align-items:center; backdrop-filter:blur(3px); }
        .buy-modal { background:#fff; color:#333; border-radius:16px; padding:28px; width:92%; max-width:420px; text-align:center; border-top:6px solid #0d9488; box-shadow:0 20px 50px rgba(0,0,0,0.35); animation:buyModalIn 0.25s ease-out; }
        @keyframes buyModalIn { from { opacity:0; transform:scale(0.92) translateY(-14px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .buy-modal img { width:110px; height:110px; object-fit:cover; border-radius:12px; border:2px solid #0d9488; margin-bottom:10px; }
        .buy-modal h3 { margin:0 0 6px 0; color:#0f172a; }
        .buy-modal .buy-sub { font-size:0.85em; color:#666; margin-bottom:14px; }
        .buy-resources { display:flex; justify-content:center; gap:28px; background:#f1f5f9; border-radius:10px; padding:10px; margin-bottom:14px; font-size:0.9em; }
        .buy-resources small { display:block; color:#777; font-size:0.8em; }
        .buy-resources b { font-size:1.1em; }
        .buy-error { color:#dc2626; font-size:0.85em; font-weight:bold; margin-bottom:12px; min-height:1em; }
        .buy-actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .buy-actions button { padding:12px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:0.95em; transition:0.2s; }
        .buy-cancel { background:#e2e8f0; color:#334155; }
        .buy-cancel:hover { background:#cbd5e1; }
        .buy-confirm { background:linear-gradient(135deg,#0d9488,#0891b2); color:#fff; }
        .buy-confirm:hover:not(:disabled) { filter:brightness(1.1); }
        .buy-confirm:disabled { opacity:0.5; cursor:not-allowed; }
        .buy-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px); background:#0f172a; color:#fff; padding:12px 22px; border-radius:10px; font-weight:bold; font-size:0.9em; z-index:1100; opacity:0; pointer-events:none; transition:all 0.3s ease; box-shadow:0 8px 20px rgba(0,0,0,0.35); }
        .buy-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .buy-toast.error { background:#b91c1c; }
        .hidden { display:none; }
        .creator-badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:0.72em; font-weight:700; margin-left:6px; vertical-align:middle; }
        .badge-user { background:#ecfdf5; color:#0f766e; border:1px solid #a7f3d0; }
        .badge-ai { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
        .create-field { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:10px; box-sizing:border-box; font-family:inherit; font-size:0.9em; }
        .create-label { display:block; font-size:0.8em; color:#555; font-weight:600; margin-bottom:4px; text-align:left; }
        .create-btn-full { width:100%; padding:10px; margin-top:6px; background:#0f766e; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
        .create-btn-full:hover { background:#0d9488; }

        /* ====== PANELES CON EL FONDO fondostorycards.png (guárdalo como images/fondostorycards.png) ======
           Sustituye al fondo blanco del panel principal y de las salas al entrar.
           Una capa oscura semitransparente mantiene el texto legible sobre la imagen. */
        .biblioteca-view .container, .sala-view.container {
            background: linear-gradient(rgba(4, 28, 38, 0.50), rgba(4, 28, 38, 0.50)),
                        url('images/fondostorycards.png') center center / cover no-repeat !important;
            color: #f1f5f9;
            border: 1px solid rgba(20, 184, 166, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
        .biblioteca-view h1 { color:#e6fffb; text-shadow:0 1px 4px rgba(0,0,0,.6); }
        .biblioteca-view h3 { color:#f1f5f9; }
        hr { border-top-color: rgba(255,255,255,0.2); }
        #search-input { background:rgba(8,28,40,0.65); color:#f1f5f9; border:1px solid rgba(20,184,166,0.5); }
        #search-input::placeholder { color:#94a3b8; }
        .result-item { border-bottom-color: rgba(255,255,255,0.15); }
        .result-item:hover { background-color: rgba(255,255,255,0.08); }
        .back-link, .sala-teatro .back-link { color:#5cd3f0 !important; }

        /* Vista de la sala (al entrar): títulos con el color de cada sala, como index.html */
        .sala-view h1 { border-bottom-width:3px; }
        .sala-view.sala-literaria h1 { color:#ff8f6e !important; border-bottom-color:#ff8f6e !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-cine h1 { color:#5b9bff !important; border-bottom-color:#5b9bff !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-animacion h1 { color:#e8cd8f !important; border-bottom-color:#e8cd8f !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-opera h1 { color:#b28ee0 !important; border-bottom-color:#b28ee0 !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-teatro h1 { color:#5cd3f0 !important; border-bottom-color:#5cd3f0 !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-extras h1 { color:#5b9bff !important; border-bottom-color:#5b9bff !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-anime h1 { color:#ff8f6e !important; border-bottom-color:#ff8f6e !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-series h1 { color:#6fdba0 !important; border-bottom-color:#6fdba0 !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-videojuegos h1 { color:#e8cd8f !important; border-bottom-color:#e8cd8f !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }
        .sala-view.sala-usuarios h1 { color:#5cd3f0 !important; border-bottom-color:#5cd3f0 !important; text-shadow:0 1px 3px rgba(0,0,0,.55); }

        /* Paneles interiores: de pastel claro a cristal oscuro sobre la imagen */
        .sala-view .info-panel {
            background: rgba(8, 28, 40, 0.62) !important;
            border-color: rgba(20, 184, 166, 0.45) !important;
            color: #e2e8f0 !important;
        }
        .sala-view .ia-notice { color:#e2e8f0 !important; border-top-color: rgba(255,255,255,0.25) !important; }
        .sala-view .entrada-item {
            background-color: rgba(8, 28, 40, 0.62) !important;
            border-color: rgba(20, 184, 166, 0.35) !important;
        }
        .sala-view .vote-stats {
            background: rgba(8, 28, 40, 0.6) !important;
            border-color: rgba(20, 184, 166, 0.4) !important;
            color: #e2e8f0;
        }
        .sala-view .titulo-original { color:#f8fafc !important; }
        .sala-view .autor { color:#cbd5e1; }
        .sala-view .synopsis-text { color:#cbd5e1; }
        .sala-view .storycard-category { color:#5cd3f0; }
        .sala-view .not-voted-badge { color:#cbd5e1; }
        .sala-view .storycard-img { background:transparent; border-color: rgba(20,184,166,0.45); }
    </style>
</head>
<body class="biblioteca-view">

<div id="biblioteca-container" class="container">
    <div class="header-wrapper">
        <a href="index.html" class="temas-btn" data-i18n="btn.laia">La IA Musical</a>
        <h1 data-i18n="title.biblioteca">Biblioteca LaIAmusical</h1>
        <a href="coleccion.html" class="temas-btn coleccion-btn"><i class="fas fa-book-open"></i> <span data-i18n="btn.coleccion">Colección</span></a>
    </div>
    <div class="search-container">
        <input type="text" id="search-input" data-i18n-placeholder="placeholder.search" placeholder="Buscar canción o sala...">
        <button class="search-btn" onclick="realizarBusqueda()" data-i18n="btn.search">Buscar</button>
    </div>
    <div id="results-container"></div>
    <hr>
    <h3 data-i18n="title.explorar">Explorar por Salas:</h3>
    <div id="salas-container"></div>
</div>

<div id="sala-container" class="container hidden">
    <div class="header-links">
        <a href="javascript:void(0)" onclick="volverABiblioteca()" class="back-link" data-i18n="btn.back">← Atrás</a>
        <div class="header-buttons">
            <a href="coleccion.html" class="temas-btn coleccion-btn"><i class="fas fa-book-open"></i> <span data-i18n="btn.coleccion">Colección</span></a>
            <a href="index.html" class="temas-btn" data-i18n="btn.laia">La IA Musical</a>
        </div>
    </div>
    <h1 id="titulo-sala"></h1>
    <div class="info-panel">
        <div id="votos-info" data-i18n="info.votos">Los votos se sincronizan con el reproductor</div>

    //  Cada servidor es una CUENTA INDEPENDIENTE: su propia colección de usuarios

    function normalizeServerId(value) {
        if (!value) return null;
        if (value === 'server1' || value === 'server2' || value === 'server3') return value;
        const s = String(value).toLowerCase();
        if (/espa|spanish/.test(s)) return 'server1';
        if (/ingl|english/.test(s)) return 'server2';
        if (/priv/.test(s)) return 'server3';
        return null;
    }
    function getServerId() {
        let id = normalizeServerId(localStorage.getItem('currentServerId'))
              || normalizeServerId(localStorage.getItem('currentServer'));
        if (!id) id = (localStorage.getItem('selectedLanguage') === 'en') ? 'server2' : 'server1'; // solo la 1ª vez
        localStorage.setItem('currentServerId', id);
        return id;
    }
    function serverSuffix(id) { id = id || getServerId(); return id === 'server1' ? '' : '_' + id; }

        { id: 104, title: "El Ave sin jaula",              titleEn: "The Bird Without a Cage",         year: 2026, category: "ÓPERA",                  topic: "Ópera y conciertos",   cover: "./imagenportada/opera_avesinjaula.png",        synopsis: "Leo, un arquitecto con una vida ordenada, se obsesiona con Elara, una artista callejera de espíritu libre. Su amor se convierte en una posesión que intenta enjaular la libertad de Elara, con una confrontación final que lo deja atrapado en su propia obsesión." },
        { id: 13,  title: "Tiempospeligrosos",             titleEn: "Dangerous Times",                 year: 2026, category: "CRIMEN",                topic: "Cine",                 cover: "./imagenportada/cine_tiempospeligrosos.png",   synopsis: "Un camarero con un pasado oscuro, un boxeador acorralado y dos cobradores se convierten en el blanco de un capitán de policía corrupto tras interceptar una libreta con los secretos de la ciudad. Deberán exponer la verdad antes de que el sistema los borre." },
        { id: 14,  title: "La línea temporal perdida",     titleEn: "The Lost Timeline",               year: 2026, category: "MAFIA",                 topic: "Cine",                 cover: "./imagenportada/cine_lineatemporal.png",       synopsis: "Una conservadora de patrimonio encuentra una pieza anómala en un silo de Toronto, conectándola con un técnico de faros en Nueva Escocia y un barrio demolido en Osaka. Juntos reconstruyen una historia deliberadamente borrada de los archivos oficiales." },
        { id: 15,  title: "Biblioteca de horizontes",      titleEn: "Library of Horizons",             year: 2026, category: "CIENCIA FICCIÓN",       topic: "Cine",                 cover: "./imagenportada/cine_bibliotecadehorizontes.png",synopsis: "Una astrofísica y una tripulación de parias espaciales viajan al agujero negro Acheron-9 tras captar un misterioso patrón gravitacional. Cada minuto en órbita les arrebata años de vida en la Tierra; deberán elegir entre el secreto cósmico o el mundo que dejaron atrás." },
        { id: 16,  title: "Alas de libertad",              titleEn: "Wings of Freedom",                year: 2026, category: "PENITENCIARIO",         topic: "Cine",                 cover: "./imagenportada/cine_alasdelibertad.png",      synopsis: "Elías Morozov, ingeniero condenado por un sabotaje que no cometió, cumple cadena perpetua en la fortaleza costera de Qara. Entre la carpintería, la amistad con Samir y los viejos desagües coloniales, empieza a planear su fuga mientras su abogada intenta reabrir el caso." },
        { id: 19,  title: "El Elegido",                    titleEn: "The Chosen One",                  year: 2026, category: "CIENCIA FICCIÓN",       topic: "Cine",                 cover: "./imagenportada/cine_elegido.png",             synopsis: "Ilya, un ingeniero de Odesa, empieza a ver fallos donde dos versiones de la ciudad se superponen. Descubre que el mundo es una 'edición' gestionada por una IA llamada la Síndica y emprende un viaje para entender su papel antes de que el Dominio fuerce un reinicio." },
        { id: 20,  title: "El imperio del trueno",         titleEn: "The Empire of Thunder",           year: 2026, category: "ACCIÓN POST-APOCALÍPTICA",topic: "Cine",                cover: "./imagenportada/cine_imperiodeltrueno.png",    synopsis: "En un corredor de tormentas entre el Cuerno de África y el Mar Rojo, la mecánica Kira une fuerzas con la ingeniera Soraya y el rastreador Rook para enfrentarse al caudillo-profeta conocido como el Trueno, que domina la energía de la región desde su Ciudadela." },
        { id: 26,  title: "Voces entre chapas",            titleEn: "Voices Between Plates",           year: 2026, category: "DRAMA",                 topic: "Cine",                 cover: "./imagenportada/cine_vocesentrechapas.png",    synopsis: "En un barrio de chapas y callejones de Kibera, varios vecinos se topan con un hallazgo inesperado que los obliga a mirar su día a día de otra forma. Sus vidas empiezan a rozarse alrededor de una iniciativa frágil que nadie planeó." },
        { id: 27,  title: "Semilla de luz",                titleEn: "Seed of Light",                   year: 2026, category: "CIENCIA FICCIÓN/FAMILIAR",topic: "Cine",               cover: "./imagenportada/cine_semilladeluz.png",        synopsis: "Durante una tormenta en Borneo, una botánica y su hijo encuentran a Ulu, un joven explorador extraterrestre que 'lee' la salud de las plantas con el tacto. Los tres forjan una amistad sin palabras mientras buscan cómo pedir ayuda entre la selva y el neón de Singapur." },
        { id: 28,  title: "El Destino",                    titleEn: "The Destiny",                     year: 2026, category: "ÓPERA ESPACIAL",         topic: "Cine",                 cover: "./imagenportada/cine_eldestino.png",           synopsis: "En un planeta desértico, una chatarrera rescata a una niña que lleva un mapa estelar incompleto. Perseguidas por el Dominio de Orión, se unen a un contrabandista y a una ex navegante para localizar una estación legendaria que podría alterar el control de las rutas espaciales." },
        { id: 29,  title: "El grito en el espacio",        titleEn: "The Scream in Space",             year: 2026, category: "CIENCIA FICCIÓN/TERROR", topic: "Cine",                 cover: "./imagenportada/cine_grito.png",               synopsis: "Una tripulación de remolque espacial encuentra en un asteroide un sarcófago alienígena que emite un pulso rítmico. La nave queda atrapada entre el interés corporativo y una señal bioluminiscente que parece llamar a algo más grande en el vacío." },
        { id: 200, title: "Una jungla divertida",          titleEn: "A Funny Jungle",                  year: 2026, category: "MUSICAL",              topic: "Animación",            cover: "./imagenportada/animacion_jungladivertida.png",synopsis: "Cuando una misteriosa sequía amenaza su hogar, un perezoso amante del silencio y una capibara apasionada por el ritmo lideran a sus amigos en una misión para reactivar una legendaria cascada, descubriendo que la jungla solo puede salvarse con el equilibrio entre sonido y silencio." },
        { id: 201, title: "Despierta mi constelación",     titleEn: "Wake Up My Constellation",        year: 2026, category: "MUSICAL",              topic: "Animación",            cover: "./imagenportada/animacion_miconstelacion.png", synopsis: "En un mundo donde las constelaciones otorgan poder, Elara nace sin una. Cuando una oscuridad llamada el Vacío amenaza con extinguir todas las estrellas, Elara descubre que su destino es encontrar la mítica Piedra Solar para restaurar el equilibrio." },
        { id: 202, title: "La aventura de tu vida",        titleEn: "The Adventure of Your Life",      year: 2026, category: "MUSICAL",              topic: "Animación",            cover: "./imagenportada/animacion_aventuradetuvida.png",synopsis: "Un grupo de amigos descubre un misterioso cofre que los lleva a una aventura llena de enigmas y secretos ocultos en una antigua montaña, donde deberán trabajar juntos para enfrentarse a fuerzas que amenazan algo muy valioso." },
        { id: 203, title: "Latidos de papel",              titleEn: "Paper Heartbeats",                year: 2026, category: "MUSICAL",              topic: "Animación",            cover: "./imagenportada/animacion_latidosdepapel.png", synopsis: "Valeria, una bibliotecaria curiosa, descubre un fajo de cartas de amor sin enviar. Intrigada, decide investigar la historia de Leo e Isabel, una pareja separada por las circunstancias, intentando desvelar el misterio de su amor congelado en el tiempo." },
        { id: 204, title: "¡Qué pasó!, mi mundo es un desmadre",titleEn: "What Happened!",            year: 2026, category: "COMEDIA MUSICAL",       topic: "Animación",            cover: "./imagenportada/animacion_mimundo.png",        synopsis: "Acompaña a Nimma Tizne, afinadora de tormentas con alergia al azúcar, y a su cabra Chispa en una carrera disparatada por Dulcelandia para reunir tres Sellos imposibles junto al notario bicéfalo Pipo. Risas, poesía mala y un desmadre que convierte el desastre en parque de atracciones." },
        { id: 205, title: "Compañeros de juguete",         titleEn: "Toy Partners",                    year: 2026, category: "MUSICAL",              topic: "Animación",            cover: "./imagenportada/animacion_compañeros.png",     synopsis: "Un grupo de juguetes olvidados cobra vida en secreto y decide escapar para descubrir el mundo más allá de una tienda. En su viaje afrontan peligros, hacen nuevos amigos y aprenden que la verdadera libertad está en elegir su propio camino juntos." },
        { id: 206, title: "La capa interior",              titleEn: "The Inner Layer",                 year: 2026, category: "ACCIÓN FAMILIAR",       topic: "Animación",            cover: "./imagenportada/animacion_capainterior.png",   synopsis: "En una ciudad donde la normalidad es obligatoria, Adrian Voss oculta que posee habilidades sobrehumanas. Un acto heroico inesperado revela su poder, convirtiéndolo en el objetivo de una organización secreta empeñada en eliminar a cualquiera que sea diferente." },
        { id: 300, title: "El eco de la libertad",         titleEn: "The Echo of Freedom",             year: 2026, category: "MUSICAL ÉPICO",         topic: "Teatro y musicales",   cover: "./imagenportada/teatro_ecodelalibertad.png",   synopsis: "Un hombre que enfrenta una injusticia que le cuesta años de su vida busca redimir su pasado y construir un futuro digno. Forjando lazos inesperados, intenta escapar de la sombra de su antigua identidad en una historia sobre segundas oportunidades y la búsqueda de la verdadera libertad." },
        { id: 301, title: "El ángel de la música",         titleEn: "The Angel of Music",              year: 2026, category: "MUSICAL GÓTICO",        topic: "Teatro y musicales",   cover: "./imagenportada/teatro_angeldelamusica.png",   synopsis: "En un prestigioso teatro de Londres, una joven cantante es guiada por una misteriosa voz masculina que la ayuda a perfeccionar su don. La presencia de su Ángel protector se vuelve cada vez más intensa y posesiva, moviéndose entre las sombras para asegurar su ascenso a cualquier costo." },
        { id: 302, title: "El ladrón de historias",        titleEn: "The Story Thief",                 year: 2026, category: "MUSICAL HIP-HOP",       topic: "Teatro y musicales",   cover: "./imagenportada/teatro_ladrondehistorias.png", synopsis: "En un mundo donde las historias son un poder tangible, un brillante huérfano descubre a un enigmático aristócrata que roba los relatos de pueblos enteros, borrando su memoria. Deberá embarcarse en una peligrosa aventura para salvar las historias del mundo." },
        { id: 303, title: "El brillo del pecado",          titleEn: "The Glitter of Sin",              year: 2026, category: "MUSICAL JAZZ",          topic: "Teatro y musicales",   cover: "./imagenportada/teatro_brillodelpecado.png",   synopsis: "En el deslumbrante París de los años 20, la rivalidad entre una ambiciosa novata y la cínica estrella del cabaret más famoso estalla en un escándalo de asesinato. La batalla por la absolución se libra no en los tribunales, sino en los titulares de los periódicos." },
        { id: 304, title: "Sin más día que hoy",           titleEn: "No More Day Than Today",          year: 2026, category: "MUSICAL CONTEMPORÁNEO", topic: "Teatro y musicales",   cover: "./imagenportada/teatro_sinmasdiaquehoy.png",   synopsis: "En el barrio de Kreuzberg, Berlín, un grupo de jóvenes artistas ha construido una familia en una vieja fábrica. Cuando una corporación les ordena desalojar, forzados a un futuro incierto, deberán unirse y decidir cómo luchar por su hogar y su modo de vida." },
        { id: 305, title: "Un verano prohibido",           titleEn: "A Forbidden Summer",              year: 2026, category: "MUSICAL CLÁSICO",       topic: "Teatro y musicales",   cover: "./imagenportada/teatro_veranoprohibido.png",   synopsis: "En las calles de Marsella, donde un odio ancestral divide a dos clanes rivales, un joven artista encuentra su musa en la persona menos indicada: la hermana de su enemigo. Juntos navegan un amor tan intenso como peligroso, desafiando un destino escrito con violencia." },
        { id: 306, title: "El vuelo de dos mundos",        titleEn: "The Flight of Two Worlds",        year: 2026, category: "MUSICAL FANTÁSTICO",    topic: "Teatro y musicales",   cover: "./imagenportada/teatro_vuelodedosmundos.png",  synopsis: "Cuando un joven de una tribu antigua rompe sus reglas más sagradas para ayudar a un misterioso forastero, ambos se embarcan en un viaje a través de continentes. Su única guía es la leyenda de una canción ancestral rota en fragmentos, clave para volver a casa." },
        { id: 400, title: "Canto de Escarcha",             titleEn: "Frost Song",                      year: 2026, category: "FANTASÍA ÉPICA",        topic: "Series",               cover: "./imagenportada/series_cantoescarcha.png",     synopsis: "En un continente dividido por la rivalidad, una antigua amenaza de hielo despierta en el norte. Mientras un honorable señor norteño busca unir a los reinos, una ambiciosa reina del sur ve la crisis como la oportunidad perfecta para consolidar su poder." },
        { id: 401, title: "El club del faro",              titleEn: "The Lighthouse Club",             year: 2026, category: "SCI-FI HORROR",         topic: "Series",               cover: "./imagenportada/series_clubdelfaro.png",       synopsis: "En el aislado pueblo costero de Puerto Sombrío, un grupo de amigos descubre una imposible frecuencia de radio completamente silenciosa. Lo que empieza como curiosidad desata extraños sucesos, guiándolos hacia el viejo faro abandonado donde algo ha comenzado a escapar." },
        { id: 402, title: "El precio de la tierra",        titleEn: "The Price of Land",               year: 2026, category: "DRAMA CRIMINAL",        topic: "Series",               cover: "./imagenportada/series_preciodelatierra.png",  synopsis: "Un brillante pero subestimado botánico de Texas, desesperado por una crisis familiar, transforma la flor más icónica del estado en un producto extremadamente valioso. Junto a un carismático ex-alumno, se adentra en un peligroso mundo subterráneo que atrae a criminales y a la ley." },
        { id: 403, title: "Albion Heritage",               titleEn: "Albion Heritage",                 year: 2026, category: "COMEDIA",               topic: "Series",               cover: "./imagenportada/series_albionheritage.png",    synopsis: "En la monótona oficina de Albion Heritage, empresa de Manchester que fabrica placas conmemorativas, el ingenioso Oliver Green se siente estancado. Todo cambia cuando él y Clara descubren una antigua y misteriosa placa de bronce en blanco que podría cambiar el legado de la empresa." },
        { id: 404, title: "El juego ha comenzado",         titleEn: "The Game Has Begun",              year: 2026, category: "MISTERIO",              topic: "Series",               cover: "./imagenportada/series_juegocomenzado.png",    synopsis: "Un brillante consultor de ciberseguridad y su nuevo compañero, un pragmático exmédico militar, son arrastrados a un peligroso juego internacional. Una misteriosa mente criminal comete crímenes imposibles en distintas ciudades europeas, dejando pistas diseñadas para desafiar al consultor." },
        { id: 405, title: "La fuente de los buenos tiempos",titleEn: "The Fountain of Good Times",    year: 2026, category: "SITCOM",                topic: "Series",               cover: "./imagenportada/series_fuentebuenostiempos.png",synopsis: "En un acogedor pub inglés, un grupo de seis amigos muy diferentes se enfrenta a los altibajos de la vida adulta. Entre aspiraciones profesionales, ocurrencias peculiares y desastres románticos, su lealtad y su mesa de siempre son el ancla que los mantiene unidos." },
        { id: 406, title: "La niña estelar",               titleEn: "The Stellar Girl",                year: 2026, category: "SPACE WESTERN",         topic: "Series",               cover: "./imagenportada/series_niñaestelar.png",       synopsis: "Una chica con una extraordinaria habilidad para predecir eventos astronómicos es reclutada por una agencia espacial, pero descubre que los adultos que quieren usar su don tienen ideas muy diferentes sobre para qué sirve." },
        { id: 500, title: "El juramento de las murallas",  titleEn: "The Oath of the Walls",           year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_juramentomurallas.png",  synopsis: "En un mundo donde la humanidad ha retrocedido tras enormes muros para sobrevivir, un joven soldado jura exterminar a los titanes que destruyeron su hogar, descubriendo verdades que sacuden los cimientos de todo en lo que creía." },
        { id: 501, title: "Loto de sangre",                titleEn: "Blood Lotus",                     year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_lotodesangre.png",       synopsis: "Un niño salvado de una masacre por un maestro agonizante hereda una técnica de combate prohibida y la deuda de sangre que conlleva. Dominar la técnica exige un nivel de furia que teme le consuma, mientras belleza y oscuridad luchan en cada batalla." },
        { id: 502, title: "Rumbo al amanecer",             titleEn: "Towards Dawn",                    year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_rumboalamanecer.png",    synopsis: "Un joven navegante sin tripulación zarpa en un mundo de océano infinito siguiendo mapas fragmentarios hacia un continente legendario que la mayoría cree un mito, reuniendo en su travesía a una improbable tripulación de creyentes." },
        { id: 503, title: "Pájaro azul",                   titleEn: "Blue Bird",                       year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_bluebird.png",           synopsis: "Un joven músico que no ha hablado desde un trauma infantil descubre que la música puede decir todo lo que las palabras no pueden, y que el amigo que se fue puede ser el único que verdaderamente lo escuchó. El pájaro azul simboliza una felicidad siempre un poco más allá." },
        { id: 504, title: "El deber del héroe",            titleEn: "The Charge of Hero",              year: 2026, category: "SUPERHÉROES",           topic: "Anime",                cover: "./imagenportada/anime_eldeber.png",             synopsis: "Un joven despierta la mañana de la batalla más importante de su generación y, en las horas previas al combate, debe encontrar dentro de sí mismo una razón para luchar que vaya más allá de las órdenes, el deber o la victoria." },
        { id: 505, title: "La rueda de las sombras",       titleEn: "The Wheel of Shadows",            year: 2026, category: "SUPERNATURAL",          topic: "Anime",                cover: "./imagenportada/anime_ruedasombras.png",       synopsis: "En un mundo donde las sombras son entidades vivas que guardan memorias del pasado, una joven investigadora con el poder de leerlas debe enfrentarse a un caso que implica su propio pasado olvidado y pone en jaque su identidad." },
        { id: 506, title: "El mundo",                     titleEn: "The World",                       year: 2026, category: "PSYCHOLOGICAL THRILLER", topic: "Anime",               cover: "./imagenportada/anime_theworld.png",          synopsis: "Un estudiante genial descubre un cuaderno sobrenatural que permite matar a cualquiera simplemente escribiendo su nombre. Creyéndose el único apto para limpiar el mundo del mal, se propone convertirse en dios de un nuevo orden, mientras un brillante detective se lanza a detenerlo." },
        { id: 25,  title: "Sin rostro",                    titleEn: "Faceless",                        year: 2026, category: "FANTASÍA",               topic: "Anime",                cover: "./imagenportada/anime_sinrostro.png",          synopsis: "Una joven espíritu es aprendiz de un espíritu sin rostro fijo, que le enseña que la identidad no es algo con lo que se nace, sino algo que debe elegirse repetidamente frente a todo lo que intenta arrebatártela." },
        { id: 600, title: "Planeta tierra",                titleEn: "Planet Earth",                    year: 2026, category: "NATURALEZA",            topic: "Documentales y usuarios",cover: "./imagenportada/doc_planetatierra.png",       synopsis: "Un viaje impresionante a través de los paisajes más extraordinarios del planeta y las asombrosas criaturas que los habitan, captado con técnicas de filmación que muestran comportamientos nunca vistos antes." },
        { id: 601, title: "El baile de hielo",             titleEn: "Ice Dance",                       year: 2026, category: "WILDLIFE",              topic: "Documentales y usuarios",cover: "./imagenportada/doc_bailedehielo.png",        synopsis: "En el entorno más extremo de la Tierra, la supervivencia no es solo una cuestión de biología: es una actuación de extraordinaria gracia, violencia y belleza improbable. Un año en la vida de un ecosistema polar, desde el regreso del sol hasta su despedida." },
        { id: 602, title: "La aguja del silencio",         titleEn: "The Needle of Silence",           year: 2026, category: "AVENTURA EXTREMA",      topic: "Documentales y usuarios",cover: "./imagenportada/doc_agujadelsilencio.png",   synopsis: "Un escalador de élite se prepara para ascender en solitario y sin cuerdas una legendaria pared de granito en la Patagonia, mientras su hermana médica observa desde abajo sabiendo que la cumbre que necesita alcanzar no tiene que ver con la altitud." },
        { id: 603, title: "El jardín de la bondad",        titleEn: "The Garden of Kindness",          year: 2026, category: "BIOGRAFÍA",             topic: "Documentales y usuarios",cover: "",                                            synopsis: "Un documental sobre la vida y el legado de un educador que dedicó décadas a enseñar empatía, bondad y amistad a través de la televisión infantil, dejando una huella imborrable en generaciones de espectadores." },
        { id: 604, title: "Sombras en el cristal",         titleEn: "Shadows in the Crystal",          year: 2026, category: "ACTIVISMO",             topic: "Documentales y usuarios",cover: "./imagenportada/doc_sombrasenelcristal.png", synopsis: "Una apasionada joven entrenadora comienza su trabajo soñado en el acuario más grande de Europa, formando un vínculo especial con Nix, una ballena beluga. A medida que aprende las realidades detrás del espectáculo, se enfrenta a un dilema que pondrá a prueba todo en lo que cree." },
        { id: 605, title: "El algoritmo silencioso",       titleEn: "The Silent Algorithm",            year: 2026, category: "TECNOLOGÍA",            topic: "Documentales y usuarios",cover: "./imagenportada/doc_algoritmosilencioso.png",synopsis: "Dos estudiantes descubren que la plataforma de redes sociales que consume la vida social de su escuela está deliberadamente diseñada para explotar vulnerabilidades psicológicas, y deciden hacer algo al respecto antes de que el algoritmo siga escribiendo el guion de sus vidas." },
        { id: 606, title: "User Generated Content Theme",  titleEn: "User Generated Content Theme",    year: 2026, category: "CUSTOM",               topic: "Documentales y usuarios",cover: "./imagenportada/user_usuarios.png",          synopsis: "Un espacio dedicado a las creaciones musicales de nuestra comunidad de usuarios." },
        { id: 800, title: "La caída del príncipe", titleEn: "The Fall of the Prince", year: 2026, category: "VIDEOJUEGO RPG", topic: "Videojuegos", cover: "./imagenportada/videojuegos_caidadelprincipe.png", synopsis: "Arthas Menethil, príncipe heredero de Lordaeron y paladín de la Mano de Plata, parte en una cruzada para erradicar una plaga nigromántica que transforma a los vivos en horrores sedientos de sangre. La búsqueda del origen de la enfermedad lo arrastra de aldea en aldea, de ciudad en ciudad, mientras cada decisión que toma resulta más oscura que la anterior y la línea entre proteger a su pueblo y destruirlo se difumina con cada paso que da." }

    function escapeHtml(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

    function getSongCategory(song,lang=getCurrentLanguage()){ return (categoryTranslations[lang]&&categoryTranslations[lang][song.category])||song.category; }
    
    // ✅ FUNCIÓN CORREGIDA: Ahora detecta correctamente la temática (videojuegos) sin importar mayúsculas/minúsculas y prioriza el topic sobre el tipo de creador.
    function getSalaKey(song) {
        const topic = String(song.topic || '').toLowerCase().trim();
        if (topic === 'literatura' || topic === 'literature') return 'literaria';
        if (topic === 'cine' || topic === 'cinema') return 'cine';
        if (topic === 'animación' || topic === 'animacion' || topic === 'animation') return 'animacion';
        if (topic === 'ópera y conciertos' || topic === 'opera y conciertos' || topic === 'opera & concerts') return 'opera';
        if (topic === 'teatro y musicales' || topic === 'theatre & musicals') return 'teatro';
        if (topic === 'series') return 'series';
        if (topic === 'anime') return 'anime';
        if (topic === 'extra y documentales' || topic === 'documentales y usuarios' || topic === 'extra & documentaries') return 'extras';
        if (topic === 'videojuegos' || topic === 'video games' || topic === 'videojuego') return 'videojuegos';
        if (topic === 'religión' || topic === 'religion') return 'extras'; 
        if (topic === 'usuarios' || topic === 'users') return 'usuarios';

        // Si no hay topic claro, usamos el tipo de creador
        if (song.creatorType === 'user') return 'usuarios';
        return 'extras';
    }

    function getOwnedSet(){ return new Set((userData.collectionCards||[]).map(String)); }

    function getTotalStars(song) {
        // Las storycards de IA suman los votos de su versión en español y en inglés (misma carta)
        const keys = (song.rankingKeys && song.rankingKeys.length) ? song.rankingKeys : [song.id];
        const total = [...new Set(keys.map(String))].reduce((acc, k) => acc + (Number(rankingStars?.[k]) || 0), 0);
        return Number.isFinite(total) ? total : 0;
    }

    function subscribeRankingStars() {
        if (unsubscribeRankingStars) unsubscribeRankingStars();
        unsubscribeRankingStars = db.collection('ranking').doc(rankingDocId()).onSnapshot((snapshot) => {
            rankingStars = snapshot.exists ? (snapshot.data().rankingStars || {}) : {};
            rankingStarsError = null;
            if (currentSala) renderSala(currentSala);
        }, (error) => {
            console.error('Error leyendo votos de Firebase:', error.code, error.message);
            rankingStarsError = error;
            if (currentSala) renderSala(currentSala);
        });
    }

    // ===================== CARGAR CARTAS DINÁMICAS (USUARIO + IA) =====================
    async function loadDynamicStorycards(){
        try {
            let firebaseSongs = [];
            const snap = await db.collection('storycards').get();
            firebaseSongs = snap.docs.map(doc => {
                const d = doc.data() || {};
                const robotCreated = d.creatorType === 'ai'
                    || d.source === 'ia'
                    || d.source === 'robot'
                    || d.status === 'done'
                    || d.enviado === true
                    || d.robotRequest?.status === 'done';
                return {
                    id: 'dyn_' + doc.id,
                    docId: doc.id,
                    title: d.title || 'Sin título',
                    titleEn: d.titleEn || d.title || 'Untitled',
                    year: d.year || 2026,
                    category: d.category || 'CUSTOM',
                    topic: d.topic || d.category || (robotCreated ? 'Animación' : 'Usuarios'),
                    cover: d.cover || FALLBACK_COVER,
                    synopsis: d.synopsis || '',
                    creatorType: d.creatorType || (robotCreated ? 'ai' : 'user'),
                    creatorName: d.creatorName || d.createdBy || '',
                    creatorId: d.creatorId || ''
                };
            }).filter(song => {
                const original = snap.docs.find(doc => song.docId === doc.id)?.data() || {};
                return original.published === true
                    || original.status === 'done'
                    || original.enviado === true
                    || original.robotRequest?.status === 'done'
                    || original.creatorType === 'ai'
                    || original.creatorType === 'user';
            });

            let robotSongs = [];
            const robotSources = [
                { path: 'data/storycards.json', assetPrefix: '' },
                { path: 'Recuperación LaIAmusical/data/storycards.json', assetPrefix: 'Recuperación LaIAmusical/' },
                { path: 'Recuperación LaIAmusical/Robot Creación storycards/storycards.json', assetPrefix: 'Recuperación LaIAmusical/' }
            ];
            for (const source of robotSources) {
                try {
                    const response = await fetch(`${source.path}?t=${Date.now()}`, { cache: 'no-store' });
                    if (!response.ok) continue;
                    const cards = await response.json();
                    if (!Array.isArray(cards)) continue;

                    const allValidCards = cards.filter(card => card && card.storyPage);
                    const validCards = allValidCards.filter(card => {
                        const isEnglish = /-en\.html$/i.test(card.storyPage || '') || /-en$/i.test(card.slug || '');
                        return !isEnglish;
                    });
                    const cardsById = new Map(allValidCards.map(card => [Number(card.id), card]));
                    robotSongs = validCards.map(card => {
                        const isEnglish = /-en\.html$/i.test(card.storyPage || '') || /-en$/i.test(card.slug || '');
                        const pair = cardsById.get(Number(card.id) + (isEnglish ? -10000 : 10000));
                        const spanish = isEnglish ? (pair || card) : card;
                        const english = isEnglish ? card : (pair || card);
                        const rawTopic = card.tematica || 'Cine';
                        const topic = String(rawTopic).trim();
                        const rawCover = card.imagen || card.portada || './images/usuarios.png';
                        let cover = String(rawCover).replace(/^[./\\]+/, '');
                        if (!/^(https?:|data:|blob:|\/)/i.test(rawCover)) {
                            cover = source.assetPrefix && !cover.startsWith(source.assetPrefix)
                                ? `${source.assetPrefix}${cover}`
                                : cover;
                        }
                        const numericId = Number(card.id);
                        const collision = staticSongs.some(item => String(item.id) === String(numericId));
                        // Claves del ranking: id de la versión en español y de la inglesa (con prefijo si colisiona con una carta fija)
                        const rankKeyFor = n => staticSongs.some(item => String(item.id) === String(n)) ? 1e13 + Number(n) : Number(n);
                        const rankingKeys = [rankKeyFor(spanish.id !== undefined ? spanish.id : numericId)];
                        if (pair) rankingKeys.push(rankKeyFor(english.id !== undefined ? english.id : pair.id));
                        return {
                            id: collision ? `ia_${numericId}` : `ia_${numericId}`,
                            rankingKeys,
                            title: spanish.titulo || card.titulo || 'Storycard',
                            titleEn: english.titulo || card.titulo || 'Storycard',
                            year: new Date(card.fechaCreacion || Date.now()).getFullYear() || 2026,
                            category: topic.toUpperCase(),
                            topic: topic,
                            cover: cover,
                            synopsis: spanish.descripcion || card.descripcion || '',
                            creatorType: 'ai',
                            creatorName: 'IA'
                        };
                    });
                    break;
                } catch (error) {
                    console.warn('No se pudieron cargar las storycards IA en la biblioteca:', source.path, error);
                }
            }

            dynamicSongs = [...firebaseSongs, ...robotSongs];
            songs = [...staticSongs, ...dynamicSongs];
            if (currentSala) renderSala(currentSala);
            else renderBibliotecaSalas();
        } catch (err) {
            console.error('Error cargando storycards dinámicas:', err);
            songs = [...staticSongs];
        }
    }

    function getSongsForSala(salaKey){ return songs.filter(s => getSalaKey(s) === salaKey); }

    // ===================== RENDERIZADO DE SALAS =====================
    
    function getLabelClass(key) {
        const map = {
            'literaria': 'sala-label--children',
            'cine': 'sala-label--animation',
            'animacion': 'sala-label--adults',
            'opera': 'sala-label--suspense',
            'teatro': 'sala-label--liveaction',
            'series': 'sala-label--science',
            'anime': 'sala-label--children',
            'extras': 'sala-label--animation',
            'videojuegos': 'sala-label--adults',
            'usuarios': 'sala-label--liveaction'
        };
        return map[key] || 'sala-label--children';
    }

    function renderBibliotecaSalas(){
        const container = document.getElementById('salas-container');
        container.className = 'bib-salas-grid';
        
        container.innerHTML = SALA_KEYS.map(k => {
            const count = getSongsForSala(k).length;
            const labelClass = getLabelClass(k);
            const roomTitle = t('sala.' + k);
            
            return `
            <div class="bib-sala-card" onclick="abrirSala('${k}')">
                <div class="sala-label ${labelClass}">
                    <h3 class="sala-title">${roomTitle}</h3>
                    <div class="sala-line"></div>
                </div>
                <span class="bib-sala-count">${count} ${t(count === 1 ? 'text.tema' : 'text.temas')}</span>
            </div>`;
        }).join('');
    }

    function abrirSala(salaKey){
        currentSala = salaKey;
        document.getElementById('results-container').innerHTML = '';
        document.getElementById('biblioteca-container').classList.add('hidden');
        const salaContainer = document.getElementById('sala-container');
        salaContainer.classList.remove('hidden');
        salaContainer.className = 'container sala-view sala-' + salaKey;
        
        document.getElementById('titulo-sala').textContent = t('sala.' + salaKey);
        
        document.getElementById('ia-notice-text').textContent = (salaKey === 'usuarios')
            ? '✨ ' + t('msg.usuarios_empty')
            : '✨ Inspiraciones originales de La IA Musical';
        const actions = document.getElementById('sala-actions');
        if (salaKey === 'usuarios') {
            actions.innerHTML = `<button class="buy-btn" onclick="abrirCreacion()"><i class="fas fa-plus"></i> ${t('btn.crear_inspiracion')}</button>`;
        } else {
            actions.innerHTML = '';
        }
        renderSala(salaKey);
    }

    function renderSala(salaKey){
        const container = document.getElementById('lista-entradas');
        const lang = getCurrentLanguage();
        const owned = getOwnedSet();
        if (rankingStarsError) {
            container.innerHTML = `<p style="padding:16px;color:red;text-align:center">${t('msg.error')} ${escapeHtml(rankingStarsError.message)}</p>`;
            return;
        }
        if (rankingStars === null) {
            container.innerHTML = `<p style="padding:16px;color:#888;text-align:center">${t('msg.loading')}</p>`;
            return;
        }
        const salaSongs = getSongsForSala(salaKey)
            .sort((a, b) => getTotalStars(b) - getTotalStars(a));
        if (salaSongs.length === 0){
            container.innerHTML = `<p style="text-align:center;color:#999;padding:30px;">${t('msg.empty')}</p>`;
            return;
        }
        container.innerHTML = salaSongs.map(song => {
            const isOwned = owned.has(String(song.id));
            const title = getSongTitle(song, lang);
            const cover = song.cover || FALLBACK_COVER;
            const totalStars = getTotalStars(song);
            const votedBadge = totalStars > 0
                ? `<span class="voted-badge"><i class="fas fa-check-circle"></i> ${t('badge.voted')}</span>`
                : `<span class="not-voted-badge"><i class="fas fa-circle"></i> ${t('badge.not_voted')}</span>`;
            let creatorBadge = '';
            if (song.creatorType === 'user') creatorBadge = `<span class="creator-badge badge-user">👥 ${t('badge.user_created')}</span>`;
            else if (song.creatorType === 'ai') creatorBadge = `<span class="creator-badge badge-ai">🤖 ${t('badge.ai_created')}</span>`;
            return `
            <div class="entrada-item">
                <div class="item-info-wrapper">
                    <img src="${cover}" onerror="this.onerror=null;this.src='${FALLBACK_COVER}';" class="storycard-img" alt="${escapeHtml(title)}">
                    <div class="titulo-autor">
                        <span class="titulo-original">${escapeHtml(title)} ${creatorBadge}</span>
                        ${song.creatorName ? `<span class="autor">${escapeHtml(song.creatorName)}</span>` : ''}
                        <span class="storycard-category">${escapeHtml(getSongCategory(song, lang))} | ${song.year || 2026}</span>
                        <span class="synopsis-text">${escapeHtml(song.synopsis || '')}</span>
                    </div>
                </div>
                <div class="controles-votacion">
                    <div class="vote-stats">
                        <span class="rating-avg"><i class="fas fa-star"></i> ${totalStars} ${t('text.votos')}</span>
                        <span>${votedBadge}</span>
                    </div>
                    ${isOwned
                        ? `<span class="owned-badge"><i class="fas fa-check-circle"></i> ${t('buy.owned')}</span>`
                        : `<button class="buy-btn" onclick="abrirCompra('${song.id}')"><i class="fas fa-gem"></i> ${t('buy.btn')}</button>`}
                </div>
            </div>`;
        }).join('');
    }

    function volverABiblioteca(){
        currentSala = '';
        document.getElementById('sala-container').classList.add('hidden');
        document.getElementById('biblioteca-container').classList.remove('hidden');
        document.getElementById('results-container').innerHTML = '';
        renderBibliotecaSalas();
    }

    function realizarBusqueda(){
        const term = (document.getElementById('search-input').value || '').trim().toLowerCase();
        const container = document.getElementById('results-container');
        if (!term){ container.innerHTML = ''; return; }
        const lang = getCurrentLanguage();
        const results = songs.filter(s =>
            String(s.title||'').toLowerCase().includes(term) ||
            String(s.titleEn||'').toLowerCase().includes(term) ||
            String(s.synopsis||'').toLowerCase().includes(term) ||
            String(s.category||'').toLowerCase().includes(term)
        );
        if (results.length === 0){
            container.innerHTML = `<p style="color:#999;">${t('msg.no_results')}</p>`;
            return;
        }
        container.innerHTML = results.slice(0, 20).map(song => {
            const title = getSongTitle(song, lang);
            const salaKey = getSalaKey(song);
            return `<div class="result-item" onclick="abrirSala('${salaKey}')"><strong>${escapeHtml(title)}</strong> — <span style="color:#666;font-size:0.85em;">${t('sala.'+salaKey)}</span></div>`;
        }).join('');
    }

    // ===================== COMPRA =====================
    function abrirCompra(id){
        if (!currentUser){ showToast(t('buy.login'), true); return; }
        const song = songs.find(s => String(s.id) === String(id));
        if (!song) return;
        cardToBuy = song;
        const lang = getCurrentLanguage();
        const title = getSongTitle(song, lang);
        document.getElementById('buyCardInfo').innerHTML = `
            <img src="${song.cover || FALLBACK_COVER}" onerror="this.onerror=null;this.src='${FALLBACK_COVER}';">
            <h3>${escapeHtml(title)}</h3>`;
        document.getElementById('buyUserDiamonds').textContent = (userData.userDiamonds || 0) + ' 💎';
        document.getElementById('buyError').textContent = '';
        const btn = document.getElementById('buyConfirmBtn');
        btn.disabled = false;
        btn.textContent = t('buy.confirmar');
        document.getElementById('buyModal').style.display = 'flex';
    }

    function cerrarCompra(){
        document.getElementById('buyModal').style.display = 'none';
        cardToBuy = null;
    }

    async function confirmarCompra(){
        if (!cardToBuy || buying || !currentUser) return;
        const song = cardToBuy;
        const songId = String(song.id);
        const lang = getCurrentLanguage();
        const title = getSongTitle(song, lang);
        buying = true;
        const btn = document.getElementById('buyConfirmBtn');
        btn.disabled = true;
        btn.textContent = t('buy.comprando');
        try {
            const userRef = db.collection(usersCollectionName()).doc(currentUser.uid);
            await db.runTransaction(async (tx) => {
                const snap = await tx.get(userRef);
                if (!snap.exists) throw new Error('NO_USER');
                const d = snap.data() || {};
                if ((d.collectionCards||[]).map(String).includes(songId)) throw new Error('OWNED');
                if ((d.userDiamonds||0) < CARD_PRICE) throw new Error('NO_DIAMONDS');
                tx.update(userRef, {
                    userDiamonds: firebase.firestore.FieldValue.increment(-CARD_PRICE),
                    collectionCards: firebase.firestore.FieldValue.arrayUnion(songId),
                    ['collectionDates.' + songId]: new Date().toISOString(),
                    activityLog: firebase.firestore.FieldValue.arrayUnion({
                        type: 'collection_purchase',
                        description: t('buy.log').replace('{title}', title),
                        songId: songId,
                        timestamp: new Date().toISOString()
                    })
                });
            });
            cerrarCompra();
            showToast(t('buy.ok'));
            if (currentSala) renderSala(currentSala);
        } catch (err){
            console.error(err);
            let msg = t('buy.error');
            if (err.message === 'OWNED') msg = t('buy.ya_tienes');
            if (err.message === 'NO_DIAMONDS') msg = t('buy.insuficientes');
            document.getElementById('buyError').textContent = msg;
            btn.disabled = false;
            btn.textContent = t('buy.confirmar');
        } finally {
            buying = false;
        }
    }

    // ===================== CREACIÓN DE INSPIRACIONES =====================
    function abrirCreacion(){
        if (!currentUser){ showToast(t('create.login'), true); return; }
        document.getElementById('createTitle').value = '';
        document.getElementById('createCover').value = '';
        document.getElementById('createSynopsis').value = '';
        document.getElementById('createCategory').value = 'CUSTOM';
        document.getElementById('createError').textContent = '';
        document.getElementById('createModal').style.display = 'flex';
    }
    function cerrarCreacion(){
        document.getElementById('createModal').style.display = 'none';
    }
    async function guardarInspiracion(){
        const title = (document.getElementById('createTitle').value || '').trim();
        const cover = (document.getElementById('createCover').value || '').trim();
        const synopsis = (document.getElementById('createSynopsis').value || '').trim();
        const category = document.getElementById('createCategory').value;
        const errEl = document.getElementById('createError');
        if (!title){ errEl.textContent = t('create.error.titulo'); return; }
        try {
            await db.collection('storycards').add({
                title: title,
                titleEn: title,
                year: 2026,
                category: category,
                topic: category, // Guardamos la categoría elegida como topic
                cover: cover || FALLBACK_COVER,
                synopsis: synopsis,
                creatorType: 'user',
                creatorId: currentUser.uid,
                creatorName: currentUser.displayName || currentUser.email || 'Usuario',
                published: true,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            cerrarCreacion();
            showToast(t('create.ok'));
            await loadDynamicStorycards();
            if (currentSala === 'usuarios') renderSala('usuarios');
        } catch (err){
            console.error(err);
            errEl.textContent = t('create.error.generico');
        }
    }

    function showToast(msg, isError){
        const el = document.getElementById('buyToast');
        el.textContent = msg;
        el.classList.toggle('error', !!isError);
        el.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
    }

    // ===================== AUTH =====================
    auth.onAuthStateChanged(async (user) => {
        if (user) subscribeRankingStars();
        if (user && !user.isAnonymous){
            currentUser = user;
            db.collection(usersCollectionName()).doc(user.uid).onSnapshot(snap => {
                if (snap.exists){
                    userData = snap.data() || {};
                    if (currentSala) renderSala(currentSala);
                    else renderBibliotecaSalas();
                }
            }, err => console.error('Error leyendo usuario:', err));
        } else {
            currentUser = null;
            userData = {};
            if (!user) {
                auth.signInAnonymously().catch((error) => {
                    console.error('Error al iniciar sesión anónima:', error.code, error.message);
                    subscribeRankingStars();
                });
            }
        }
    });

    // ===================== INIT =====================
    document.addEventListener('DOMContentLoaded', () => {
        updateUITranslations();
        renderBibliotecaSalas();
        loadDynamicStorycards();
    });
    window.addEventListener('storage', (e) => {
        if (e.key === 'selectedLanguage') updateUITranslations();
    });
</script>
