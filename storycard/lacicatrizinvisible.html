<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>La cicatriz invisible</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── UI WRAPPER ── */
  .ui-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 10px 10px 8px;
    gap: 8px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
    gap: 6px;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }
  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-btn:active { background: rgba(200,169,110,0.25); }
  .audio-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.46rem;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.55);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .audio-divider {
    width: 1px;
    height: 18px;
    background: rgba(200,169,110,0.2);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* Voice indicator */
  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
    flex-shrink: 0;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
    animation: none;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  #musicVolume {
    width: 44px;
    accent-color: var(--gold);
    cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }

  /* ── OPEN HINT ── */
  .open-hint-badge {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 6px 16px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
    z-index: 30;
    white-space: nowrap;
  }
  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }
  .open-hint-badge svg { opacity: 0.7; flex-shrink: 0; }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── BOOK CARD ── */
  .book-card {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.05),
      inset -3px 0 8px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    background: var(--cream);
    -webkit-tap-highlight-color: transparent;
    perspective: 1400px;
  }

  /* Lomo del libro */
  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, var(--spine), rgba(139,110,80,0.3));
    z-index: 20;
    pointer-events: none;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-bg-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #4a3520, #1a1008);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6rem;
    opacity: 0.5;
  }
  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 24px;
  }
  .cover-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .cover-overlay .author {
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.1em;
  }

  .cover-page::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(200,169,110,0);
    transition: background 0.3s;
    pointer-events: none;
  }
  .cover-page:active::after { background: rgba(200,169,110,0.08); }

  /* ── STORY PAGE ── */
  .story-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    background: var(--cream);
  }

  .page-illustration {
    width: 100%;
    flex-shrink: 0;
    position: relative;
    background: var(--cream-dark);
    line-height: 0;
  }
  .page-illustration img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .img-placeholder {
    width: 100%;
    padding: 40px 0;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-placeholder svg { opacity: 0.15; width: 70px; height: 70px; }

  /* Marco perimetral */
  .page-illustration::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    box-shadow:
      inset 0    30px 22px -8px var(--cream),
      inset 0   -42px 28px -8px var(--cream),
      inset  28px 0   22px -8px var(--cream),
      inset -28px 0   22px -8px var(--cream);
  }
  .page-illustration::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55px;
    z-index: 3;
    background: linear-gradient(to bottom, transparent, var(--cream));
    pointer-events: none;
  }

  /* Sección de texto */
  .page-text-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 20px 26px;
    position: relative;
    background: var(--cream);
  }
  .chapter-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
    opacity: 0.6;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif;
    font-size: 4.4rem;
    font-weight: 700;
    line-height: 0.75;
    float: left;
    margin-right: 6px;
    margin-top: 4px;
    color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.12rem;
    line-height: 1.7;
    color: var(--ink);
    text-align: justify;
    position: relative;
    z-index: 1;
    background-image: repeating-linear-gradient(
      transparent, transparent 30px,
      rgba(180,160,130,0.13) 30px,
      rgba(180,160,130,0.13) 31px
    );
    background-position: 0 4px;
  }
  .page-text p { margin-bottom: 0.8em; }
  .page-text p::after { content: ''; display: table; clear: both; }

  .page-number {
    margin-top: 10px;
    text-align: right;
    font-family: 'Playfair Display', serif;
    font-size: 0.72rem;
    color: var(--ink-light);
    opacity: 0.5;
    position: relative;
    z-index: 2;
  }

  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 14px 0 16px;
    color: var(--ink-light);
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-family: 'Playfair Display', serif;
    opacity: 0.4;
    flex-shrink: 0;
    background: var(--cream);
  }

  /* ── NAVIGATION ARROWS ── */
  @keyframes arrowPulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(200,169,110,0.55), 0 0 10px 2px rgba(200,169,110,0.25);
      background: rgba(200,169,110,0.22);
      border-color: rgba(200,169,110,0.7);
    }
    50% {
      box-shadow: 0 0 0 8px rgba(200,169,110,0), 0 0 18px 4px rgba(200,169,110,0.45);
      background: rgba(200,169,110,0.42);
      border-color: var(--gold);
    }
  }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200,169,110,0.22);
    border: 1.5px solid rgba(200,169,110,0.7);
    border-radius: 50%;
    color: var(--gold);
    cursor: pointer;
    transition: background 0.2s, opacity 0.3s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    animation: arrowPulse 1.5s ease-in-out infinite;
  }
  .nav-arrow:active { background: rgba(200,169,110,0.55); }
  .nav-arrow.hidden { opacity: 0; pointer-events: none; animation: none; }
  .nav-arrow svg { width: 18px; height: 18px; filter: drop-shadow(0 0 3px rgba(200,169,110,0.6)); }
  .nav-arrow-left  { left: 6px; }
  .nav-arrow-right { right: 6px; }

  /* ── END PAGE ── */
  .end-page {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
  }
  .end-page-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 30px;
    text-align: center;
  }
  .end-page-content .ornament { color: var(--gold); font-size: 1.8rem; opacity: 0.6; }
  .end-page-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .end-page-content p {
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    color: var(--ink-light);
    opacity: 0.7;
    letter-spacing: 0.1em;
  }
  .back-btn {
    margin-top: 6px;
    padding: 10px 24px;
    border: 1px solid var(--gold);
    background: none;
    color: var(--ink-light);
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { background: var(--gold); color: var(--cream); }

  /* ── NAV DOTS ── */
  .nav-dots {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    padding: 2px 0;
    z-index: 10;
    position: relative;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(200,169,110,0.3);
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(200,169,110,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ══════════════════════════════════════════════════════
     PAGE FLIP ANIMATIONS
  ══════════════════════════════════════════════════════ */
  @keyframes pageFlipInForward {
    0%   { transform: perspective(1400px) rotateY(-88deg); transform-origin: left center;  opacity: 0.4; filter: brightness(0.6); }
    40%  { opacity: 0.85; filter: brightness(0.85); }
    100% { transform: perspective(1400px) rotateY(0deg);   transform-origin: left center;  opacity: 1;   filter: brightness(1); }
  }
  @keyframes pageFlipInBackward {
    0%   { transform: perspective(1400px) rotateY(88deg);  transform-origin: right center; opacity: 0.4; filter: brightness(0.6); }
    40%  { opacity: 0.85; filter: brightness(0.85); }
    100% { transform: perspective(1400px) rotateY(0deg);   transform-origin: right center; opacity: 1;   filter: brightness(1); }
  }
  @keyframes pageFlipOutForward {
    0%   { transform: perspective(1400px) rotateY(0deg);   transform-origin: left center;  opacity: 1;   filter: brightness(1); }
    60%  { opacity: 0.5; filter: brightness(0.7); }
    100% { transform: perspective(1400px) rotateY(-88deg); transform-origin: left center;  opacity: 0;   filter: brightness(0.4); }
  }
  @keyframes pageFlipOutBackward {
    0%   { transform: perspective(1400px) rotateY(0deg);  transform-origin: right center;  opacity: 1;   filter: brightness(1); }
    60%  { opacity: 0.5; filter: brightness(0.7); }
    100% { transform: perspective(1400px) rotateY(88deg); transform-origin: right center;  opacity: 0;   filter: brightness(0.4); }
  }

  .anim-in-forward   { animation: pageFlipInForward   0.42s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  .anim-in-backward  { animation: pageFlipInBackward  0.42s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  .anim-out-forward  { animation: pageFlipOutForward  0.22s cubic-bezier(0.4,0,1,1) both; }
  .anim-out-backward { animation: pageFlipOutBackward 0.22s cubic-bezier(0.4,0,1,1) both; }

  .page-shadow-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 40%);
    animation: shadowSweepForward 0.55s ease-out forwards;
  }
  .page-shadow-overlay.backward {
    background: linear-gradient(to left, rgba(0,0,0,0.18) 0%, transparent 40%);
    animation: shadowSweepBackward 0.55s ease-out forwards;
  }
  @keyframes shadowSweepForward  { 0% { opacity: 0.8; } 100% { opacity: 0; } }
  @keyframes shadowSweepBackward { 0% { opacity: 0.8; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div class="ui-wrapper">

  <div class="top-bar">
    <p class="book-title-header">✦ La cicatriz invisible ✦</p>

    <div class="audio-bar" id="audioBar">
      <div class="voice-indicator" id="voiceIndicator">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="audio-label">NARRADOR</span>
      <button class="audio-btn" id="btnVoicePause" title="Pausar/Reanudar narración" onclick="toggleVoicePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconVoicePause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Detener narración" onclick="stopVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
        </svg>
      </button>

      <div class="audio-divider"></div>

      <span class="audio-label">MÚSICA</span>
      <button class="audio-btn" id="btnMusicPause" title="Pausar/Reanudar música" onclick="toggleMusicPause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusicPause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Silenciar música" onclick="toggleMusic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusic">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4"
        title="Volumen música" oninput="setMusicVolume(this.value)">
    </div>
  </div>

  <div class="book-wrapper" id="bookWrapper">

    <div class="open-hint-badge" id="openHintBadge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Toca para abrir
    </div>

    <div class="nav-arrow nav-arrow-left hidden" id="navLeft" onclick="prevPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
    <div class="nav-arrow nav-arrow-right hidden" id="navRight" onclick="nextPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>

    <div class="book-card" id="bookCard"></div>
  </div>

  <div class="nav-dots" id="navDots"></div>

</div>
<script>
const MUSIC_SRC = "storycard/lacicatrizinvisible.mp3";
const pages = [
  {
    type: 'cover',
    coverImg: "storycard/lacicatrizinvisible/portada.png",
    coverMobileImg: "storycard/lacicatrizinvisible/portadamovil.png",
    title: "La cicatriz invisible",
    author: "De LaIAmusical"
  },
  {
    type: 'story',
    pageNum: 1,
    chapterTitle: "Capítulo 1: El piso de Greyfriars",
    illustrationSrc: "storycard/lacicatrizinvisible/imagen1.png",
    voiceSrc: "storycard/lacicatrizinvisible/voz1.wav",
    text: "El despacho del señor Davies olía a papel y té negro. Fuera, una llovizna persistente empapaba las calles de la Old Town de Edimburgo. Lucy Harper sostenía una llave de hierro, pesada y de dientes mellados, que parecía pertenecer a un castillo y no a un tercer piso en Greyfriars Place.\n\n\n\n—Tu tía abuela Elspeth fue muy clara en su testamento —dijo el señor Davies, ajustándose las gafas—. El piso es tuyo. Sin condiciones, salvo la nota que te he entregado. Puedes venderlo, alquilarlo... Lo que estimes oportuno.\n\n\n\nLucy asintió, aunque la idea de venderlo ni se le pasaba por la cabeza. Con la beca del máster en Ciencias Ambientales apenas le llegaba para el material y la comida, y compartir un piso diminuto con otros tres estudiantes la estaba volviendo loca. Aquella herencia era un salvavidas.\n\n\n\n—No lo venderé. Me quedaré allí mientras acabo el posgrado.\n\n\n\n—Una decisión sensata —convino el abogado, aunque una sombra de duda cruzó su mirada—. Es un buen edificio, victoriano, con unas vistas magníficas a la tapia trasera del Royal Botanic Garden. Un poco... tranquilo, quizás.\n\n\n\nAl llegar, la puerta del portal, de un verde oscuro casi negro, se abrió con un gemido. El aire en la escalera era frío, impregnado de un aroma a cera de abeja y humedad antigua. El piso, el 3A, estaba al final de un tramo de escalones que crujían bajo sus botas. Introdujo la llave y la giró. La cerradura protestó, pero finalmente cedió con un *clac* metálico que resonó en el silencio.\n\n\n\nEl interior era espacioso, con techos altos y molduras de yeso. Los muebles, cubiertos con sábanas blancas, parecían fantasmas esperando en una fiesta interrumpida. La luz gris de la tarde se filtraba por los ventanales, revelando motas de polvo que bailaban en el aire. Olía a lavanda seca y a libros viejos. En la mesa del vestíbulo, junto a un teléfono de disco desconectado, encontró un sobre amarillento. Dentro, una sola hoja doblada. La caligrafía, temblorosa y angulosa, decía simplemente:\n\n\n\nDon’t open the attic (No abras la buhardilla).\n\nLucy frunció el ceño. ¿Una broma de su excéntrica tía abuela? ¿O una advertencia real? Miró hacia el techo del pasillo, pero no vio ninguna trampilla, solo una superficie lisa de pintura desconchada. Decidió ignorarlo. Tenía un techo sobre su cabeza, y eso era lo único que importaba."

  {
    type: 'story',

    chapterTitle: "Capítulo 2: La vecina del segundo",
    illustrationSrc: "storycard/lacicatrizinvisible/imagen2.png",
    voiceSrc: "storycard/lacicatrizinvisible/voz2.wav",
    text: "Al día siguiente, mientras bajaba con una bolsa de basura, una puerta se abrió en el segundo piso. Una mujer menuda, de pelo blanco recogido en un moño y ojos azules vivaces, la observaba desde el umbral.\n\n\n\n—Tú debes de ser la sobrina de Elspeth. Soy Aileen MacLeod. Bienvenida.\n\n\n\n—Lucy Harper. Encantada.\n\n\n\nDe pronto, un sonido agudo y repetitivo llenó el rellano: *¡ring-ring!*. Sonaba exactamente como el timbre de la puerta principal.\n\n\n\nAileen sonrió con resignación. —No hagas caso. Es Pip. Mi canario. Imita el timbre. El marido de mi vecina del primero es cartero, así que lo oye a todas horas.\n\n\n\nLucy sonrió, extrañada. —¿Y qué hace cuando suena el teléfono?\n\n\n\n—Lo mismo, pero con el teléfono de disco que teníais arriba. Lleva años sin sonar, pero él no lo olvida.\n\n\n\nAileen la invitó a pasar a un piso atestado de libros, fotografías en blanco y negro y plantas. Su marido, explicó, había sido fotógrafo en *The Scotsman*.\n\n\n\n—Me alegro de que alguien ocupe el piso de nuevo —dijo Aileen, sirviéndole una taza de té—. Aquí los inquilinos duran poco. Algunos se quejan de las corrientes de aire, otros del silencio. Pero yo sé la verdad. —Se inclinó hacia delante, bajando la voz—. La casa se cansa de la gente.\n\n\n\nLucy arqueó una ceja, escéptica. —¿Se cansa?\n\n\n\n—Sí. Es un edificio viejo. Tiene sus hábitos. Y no le gusta que lo molesten. Ten cuidado ahí arriba, niña.\n\n\n\nEsa noche, mientras leía en el sofá del salón, lo oyó por primera vez. Unos pasos lentos, mesurados, cruzaron el techo sobre su cabeza. Iban desde la esquina sobre la chimenea hasta la pared que daba al pasillo, y luego volvían. Lucy se quedó helada. Sabía que el cuarto de arriba, el que correspondía a esa zona, estaba completamente vacío. Lo había comprobado esa misma tarde: solo había una silla desvencijada y una alfombra enrollada. Pensó en las tuberías, en la madera dilatándose. Encontró una explicación para todo, pero no pudo evitar sentir un escalofrío."

  {
    type: 'story',
    pageNum: 3,
    chapterTitle: "Capítulo 3: El anuncio",
    illustrationSrc: "storycard/lacicatrizinvisible/imagen3.png",
    voiceSrc: "storycard/lacicatrizinvisible/voz3.wav",
    text: "Los gastos de comunidad y una factura de electricidad inesperada hicieron que la realidad se impusiera. Necesitaba compartir gastos. Con desgana, redactó un anuncio y lo colgó en el tablón de anuncios de la universidad y en un par de webs.\n\n\n\nRecibió tres llamadas. Dos eran de estudiantes ruidosos que preguntaron si podían hacer fiestas. La tercera fue de un hombre con un acento suave de Europa del Este. Se llamaba Jonas Koval.\n\n\n\nCuando llegó, Lucy vio a un hombre alto y delgado, de unos treinta años, con una sonrisa fácil y unos ojos claros que parecían analizarlo todo. Llevaba una chaqueta gastada y una maleta de aspecto pesado.\n\n\n\n—Soy técnico de sonido —explicó, mientras Lucy le enseñaba la habitación—. Trabajo como freelance. A veces grabo efectos para películas, otras mezclo música para grupos locales. Necesito un sitio tranquilo.\n\n\n\nLa habitación era perfecta, con un gran ventanal y espacio de sobra. Jonas miró el techo, luego las paredes, y asintió lentamente.\n\n\n\n—Me gusta. Tiene… buena acústica.\n\n\n\n—Hay crujidos —advirtió Lucy, sintiéndose extrañamente obligada a ser honesta—. Es un edificio antiguo.\n\n\n\n—Los edificios antiguos tienen memoria. Eso es bueno para mi trabajo. —Su sonrisa se amplió. No preguntó por avales ni hizo preguntas incómodas. Sacó un fajo de billetes arrugados—. Puedo pagarte los dos primeros meses ahora mismo.\n\n\n\nLucy sintió un alivio inmenso. La necesidad económica pesó más que cualquier recelo. Firmaron un contrato simple en la mesa de la cocina. Mientras él subía sus cosas, Lucy vio que la maleta pesada estaba, en efecto, llena de cables, micrófonos de varios tamaños y aparatos extraños."

    voiceSrc: "storycard/lacicatrizinvisible/voz4.wav",
    text: "Jonas se instaló en la habitación del fondo, la que estaba bajo el cuarto vacío que Lucy había inspeccionado. Montó allí lo que parecía un pequeño estudio de sonido, con paneles de espuma en las paredes y un ordenador rodeado de equipos. Era un inquilino silencioso y ordenado, casi invisible durante el día.\n\n\n\nPero por la noche, todo cambiaba.\n\n\n\nLucy se despertaba de madrugada por sonidos extraños que venían de su habitación. No era música, ni voces. Eran zumbidos graves, casi inaudibles, el siseo de cintas rebobinándose a gran velocidad y, de vez en cuando, golpes secos y arrastrados, como si moviera muebles pesados por el suelo de madera.\n\n\n\nUna mañana, se lo encontró en la cocina, con los auriculares al cuello y cara de no haber dormido.\n\n\n\n—Jonas, ¿qué son esos ruidos por la noche? —preguntó Lucy, intentando no sonar acusadora—. Parece que estás de mudanza cada dos horas.\n\n\n\nÉl se sirvió un café, sin mirarla directamente. —Lo siento si te he molestado. Estoy trabajando. Capturo “ambientes”. Silencios. El sonido de una habitación vacía.\n\n\n\n—¿Y los golpes?\n\n\n\n—Pruebo frecuencias. A veces, para simular impactos o presencias en una película, usamos sonidos de muy baja frecuencia. Infrasonidos. No siempre los oyes, pero los sientes. Generan ansiedad, una sensación de que hay algo más en la habitación.\n\n\n\nLucy lo miró sin comprender. Sobre la mesa, él había dejado una libreta abierta. En una página, había una lista de números anotados a mano, con la palabra \"pico\" al lado: *19 Hz, 23 Hz, 27 Hz*.\n\n\n\n—¿Y encuentras muchos de esos… ambientes… aquí? —preguntó ella.\n\n\n\nJonas levantó la vista por fin. Su sonrisa fácil había desaparecido. —Más de los que esperaba. Este lugar es un archivo."

    voiceSrc: "storycard/lacicatrizinvisible/voz5.wav",
    text: "Una tarde de tormenta, el viento aullaba contra los ventanales y la lluvia golpeaba el tejado con furia. Un olor denso, a humedad y papel viejo en descomposición, se filtró en el pasillo. Lucy siguió el rastro con la nariz hasta detenerse justo debajo de una sección del techo que parecía ligeramente abombada. Al pasar la mano, notó el contorno rectangular de una trampilla, sellada con capa sobre capa de pintura blanca.\n\n\n\nLa nota de su tía abuela resonó en su mente: Don’t open the attic.\n\n\n\nPero el olor era nauseabundo, y el miedo a una gotera pudo más que la advertencia. Subida a una silla, usó la punta de un destornillador para raspar la pintura y forzar el borde. La madera cedió con un crujido seco y la trampilla se abrió hacia abajo, liberando una bocanada de aire viciado.\n\n\n\nCon la ayuda de una linterna, se asomó. Dentro había una buhardilla baja, apenas un metro de altura en su punto más alto. El suelo estaba cubierto de polvo y telarañas. Apiladas contra una pared, vio varias cajas de cartón llenas de diapositivas fotográficas. En un rincón, un colchón viejo, sin sábanas, manchado de óxido. Y en el centro, clavado en la viga principal de madera, un cartel escolar, de esos que se usan en las bibliotecas. Escrito con rotulador negro, rezaba:\n\n\n\nQuiet please (Silencio, por favor).\n\n\n\nLa sensación de estar invadiendo un espacio prohibido era tan fuerte que estuvo a punto de cerrar la trampilla. Pero algo la detuvo. Era la incongruencia de todo aquello: un colchón, cajas de fotos y un cartel pidiendo silencio en un lugar que llevaba décadas sellado."

    voiceSrc: "storycard/lacicatrizinvisible/voz6.wav",
    text: "Movida por una curiosidad más fuerte que el miedo, Lucy se izó a la buhardilla. El aire era casi irrespirable. Entre las cajas de diapositivas, encontró una vieja grabadora de bobina abierta, un modelo pesado de los años setenta. A su lado, una única caja de cinta magnética. La etiqueta, escrita a mano, decía: Session 1978 — Tenant (Sesión 1978 - Inquilino).\n\n\n\nCon el corazón latiéndole deprisa, bajó la grabadora y la cinta al piso. La limpió del polvo y, para su sorpresa, encontró el cable de alimentación. La enchufó en el salón y colocó la cinta. Dudó un instante, luego pulsó el botón de ‘Play’.\n\n\n\nLos altavoces emitieron un siseo durante casi un minuto. Silencio. Luego, una respiración contenida, casi un jadeo. Y entonces, una voz infantil, de niño, clara y cercana, repitió en un susurro monótono:\n\n\n\n—I’m not here. I’m not here. I’m not here (No estoy aquí. No estoy aquí).\n\n\n\nLucy sintió que se le helaba la sangre. De fondo, apenas perceptible, se oía un golpeteo rítmico. Tres toques, una pausa. Tres toques, una pausa. Como unos nudillos golpeando contra madera.\n\n\n\n—Eso es infrasonido.\n\n\n\nLucy dio un respingo. Jonas estaba de pie en el umbral del salón, observándola. No lo había oído llegar.\n\n\n\n—¿Qué? —balbuceó ella, apagando la grabadora.\n\n\n\n—El golpeteo —dijo él, acercándose—. No lo oyes del todo, ¿verdad? Lo sientes. Es una vibración en el pecho. Está grabado a una frecuencia muy baja. Es lo que he estado midiendo estas noches. Un pulso constante que viene de arriba.\n\n\n\nSeñaló la grabadora. —¿Lo has encontrado en la buhardilla?\n\n\n\nLucy asintió, incapaz de hablar.\n\n\n\n—Creía que eran las tuberías o la estructura del edificio —continuó Jonas, más para sí mismo que para ella—. Pero es esto. O lo que sea que grabara esto. Ha dejado una huella. Una cicatriz sónica."

    voiceSrc: "storycard/lacicatrizinvisible/voz7.wav",
    text: "A la mañana siguiente, llamaron a la puerta. Era Aileen, con una expresión preocupada. Sostenía una carpeta de cartón abultada y raída.\n\n\n\n—Anoche oí ruidos extraños —dijo sin preámbulos—. No los pasos de siempre. El sonido de la trampilla. Sabía que al final la abrirías. Elspeth también lo hizo.\n\n\n\nEntró y dejó la carpeta sobre la mesa. —Mi marido era un hombre metódico. Guardaba copias de todos los contratos de alquiler de este piso desde que lo compramos en los setenta. Pensé que debías ver esto.\n\n\n\nLucy abrió la carpeta. Dentro, apilados, había docenas de contratos. El patrón era desolador. Cada inquilino duraba unos pocos meses, a veces solo semanas. La mayoría se iba sin dar explicaciones, perdiendo la fianza. Algunos, sin embargo, habían dejado una nota. En casi todas se repetía la misma queja, con distintas palabras: Someone walks upstairs, Noises from the ceiling, I can’t sleep.\n\n\n\nUn nombre se repetía una y otra vez como avalista en varios contratos de finales de los setenta: E. Merrill.\n\n\n\n—¿Quién es E. Merrill? —preguntó Lucy.\n\n\n\n—No lo sé —respondió Aileen—. Pero mira esto.\n\n\n\nDe un bolsillo, sacó una foto amarillenta. Mostraba a un niño de unos ocho o nueve años, delgado, de pelo oscuro y ojos grandes y serios. Llevaba un uniforme escolar que Lucy reconoció: el del colegio St Giles, a pocas calles de allí. Estaba sentado en el bordillo del jardín trasero. Detrás de la foto, una anotación con la misma caligrafía temblorosa de la nota de su tía: Eliot — 1978.\n\n\n\nEliot Merrill. E. Merrill.\n\n\n\n—¿Qué le pasó? —susurró Lucy.\n\n\n\nAileen negó con la cabeza. —Nadie lo sabe. Un día, simplemente, dejó de venir al colegio. La familia se mudó poco después. Nunca se habló de ello. La gente de antes era así. Enterraban las cosas. A veces, literalmente."

    illustrationSrc: "storycard/lacicatrizinvisible/imagen8.png",
    voiceSrc: "storycard/lacicatrizinvisible/voz8.wav",
    text: "Esa tarde, Jonas subió a la buhardilla con uno de sus aparatos, un medidor de espectro de sonido. Lucy lo siguió, reticente. El aire allí arriba seguía siendo pesado y frío.\n\n\n\n—No hay nada aquí —dijo Jonas, barriendo el espacio con el micrófono del medidor—. Ninguna fuente de energía, nada eléctrico.\n\n\n\n—Entonces, ¿qué es lo que oímos?\n\n\n\n—Un eco. Un residuo. —Se detuvo junto al colchón y le pidió a Lucy que encendiera la grabadora de nuevo, abajo en el salón.\n\n\n\nEn cuanto la voz del niño susurró I’m not here, el medidor de Jonas cobró vida. La aguja saltó y se clavó en un punto.\n\n\n\n—19 Hz —murmuró Jonas, asombrado—. Un pico constante y puro, justo aquí. En el resto del piso fluctúa, pero aquí es donde se concentra.\n\n\n\nApagó el medidor y se sentó en el suelo polvoriento. —A 19 hercios, el globo ocular humano empieza a vibrar. No ves nada, pero tu cerebro cree que sí. Percibes sombras por el rabillo del ojo, figuras que no están. Sientes una presión en el pecho, un miedo primordial sin causa aparente. Los científicos lo llaman “la frecuencia del miedo”.\n\n\n\n—¿Quieres decir que todo esto… es solo un sonido? —preguntó Lucy, queriendo creerlo.\n\n\n\n—No. El sonido es el síntoma, no la enfermedad. Algo ocurrió aquí. Algo tan traumático que dejó una marca, una grabación en el propio espacio. El niño, Eliot… quizás se escondía aquí. Quizás este era su refugio, y repetía esa frase para hacerse invisible. No estoy aquí. Una y otra vez, hasta que la casa se lo aprendió de memoria.\n\n\n\nEsa noche, Lucy soñó. Soñó con un niño pequeño, acurrucado entre cajas en la oscuridad de la buhardilla. Oía pasos subiendo por la escalera. El niño se tapaba la boca con las manos para que no se le escapara un grito, y en su mente repetía una y otra vez la misma letanía, mientras su corazón golpeaba contra sus costillas a un ritmo sordo y constante."

  {

    voiceSrc: "storycard/lacicatrizinvisible/voz9.wav",
    text: "Una avería en el transformador de la calle dejó Greyfriars Place a oscuras. La luz se fue con un parpadeo, sumiendo el piso en un silencio denso y absoluto. Lucy y Jonas encendieron velas, creando un círculo de luz temblorosa en el salón.\n\n\n\n—Justo lo que necesitábamos —masculló Lucy, abrazándose las rodillas.\n\n\n\nAl principio, no pasó nada. Pero pasada la medianoche, los sonidos comenzaron. Los pasos sobre el techo ya no eran lentos y mesurados. Eran rápidos, frenéticos, como si alguien corrijetara en círculos en la buhardilla. Se oían golpes, no el rítmico golpeteo de la cinta, sino impactos violentos, como si un cuerpo chocara contra las vigas.\n\n\n\nDe repente, un *crack* seco resonó en el pasillo.\n\n\n\n—La trampilla —susurró Jonas.\n\n\n\nSe asomaron con una linterna. La trampilla de la buhardilla estaba abierta, colgando sobre sus goznes. Y del interior oscuro, llegó un sonido que les heló la sangre. El motor de la grabadora de bobina, que seguía arriba, empezó a girar. Lenta, inexorablemente, a pesar de no estar enchufada.\n\n\n\nEntonces, la voz infantil sonó, no desde la cinta, sino desde la propia buhardilla. Clara, nítida, y terriblemente cercana.\n\n—I’m leaving now (Me voy ahora).\n\n\n\nEl colchón viejo, visible desde abajo, se hundió de golpe, como si alguien muy pesado se levantara de él. Hubo un silencio expectante que duró una eternidad. Luego, un último crujido en la escalera del portal y el portazo de la calle retumbó en todo el edificio.\n\n\n\nDespués, nada. El silencio que quedó era diferente. Vacío."

    voiceSrc: "storycard/lacicatrizinvisible/voz10.wav",
    text: "Al amanecer, cuando la luz volvió, Jonas ya había hecho la maleta. No se despidió. Sobre la mesa de la cocina, dejó las llaves, el dinero del alquiler que faltaba, la grabadora de bobina y una nota escueta: It wasn’t him. It was the house. Good luck (No era él. Era la casa. Buena suerte).\n\n\n\nLucy no lo culpó. Llamó a un carpintero esa misma mañana.\n\n\n\n—Quiero que selle esa trampilla —le dijo, señalando al techo—. Con tablas, con yeso, con lo que sea. No quiero que pueda volver a abrirse. Nunca.\n\n\n\nSemanas después, la vida había vuelto a una aparente normalidad. Sin Jonas, el dinero volvía a escasear. Lucy puso otro anuncio, casi con las mismas palabras: Habitación exterior luminosa….\n\n\n\nLa primera candidata se llamaba Mara. Era estudiante de Bellas Artes, con una carpeta llena de dibujos al carboncillo y una mirada curiosa. Mientras recorría el piso, se detuvo en el pasillo.\n\n\n\n—Es muy silencioso, ¿verdad? A veces, en los pisos antiguos, se oyen ruidos de los vecinos, tuberías…\n\n\n\nLucy sintió una presión sorda en el pecho. La reconoció al instante, como se reconoce un dolor crónico, un apellido. Era la frecuencia. La cicatriz. Sonrió, una sonrisa que no le llegó a los ojos.\n\n\n\n—Aquí no se oye nada —mintió—. El edificio es antiguo, cruje un poco, pero es tranquilo.\n\n\n\nY mientras lo decía, supo que acababa de heredar algo más que un piso. Había heredado el miedo, la historia. Se había convertido en la nueva guardiana del secreto. Mara asintió, satisfecha, y firmó el contrato.\n\n\n\nEsa noche, y todas las noches siguientes, Lucy durmió con la puerta de su cuarto entornada, escuchando el silencio del pasillo, no como quien espera que no pase nada, sino como quien espera un tren que sabe que ya pasó, pero cuya vibración aún perdura en los raíles. La casa estaba en silencio, pero Lucy había aprendido a escuchar lo que no sonaba. Y ese, se dio cuenta, era el verdadero eco de la tragedia."

const musicAudio  = new Audio();
musicAudio.loop   = true;
musicAudio.volume = 0.4;
if (MUSIC_SRC) musicAudio.src = MUSIC_SRC;

let voiceAudio   = null;
let voicePaused  = false;
let musicMuted   = false;
let musicPaused  = false;
let bookOpened   = false;

function startMusic() {
  if (!MUSIC_SRC || musicMuted) return;
  musicAudio.currentTime = 0;
  musicAudio.play().catch(() => {});
  updateMusicPauseIcon(true);
}

function stopAllAudio() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
  voicePaused = false;
  setVoiceIndicator(false);
  updateVoicePauseIcon(false);
}

function playPageVoice(src) {
  stopAllAudio();
  if (!src) return;
  voiceAudio = new Audio(src);
  voiceAudio.volume = 1;
  voiceAudio.play().catch(() => {});
  voiceAudio.onplay  = () => { setVoiceIndicator(true);  updateVoicePauseIcon(true); };
  voiceAudio.onended = () => { setVoiceIndicator(false); updateVoicePauseIcon(false); voicePaused = false; };
  voiceAudio.onpause = () => { setVoiceIndicator(false); };
}

function setVoiceIndicator(playing) {
  const el = document.getElementById('voiceIndicator');
  if (el) el.className = 'voice-indicator' + (playing ? ' playing' : '');
}

function updateVoicePauseIcon(isPlaying) {
  const icon = document.getElementById('iconVoicePause');
  if (!icon) return;
  icon.innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function toggleVoicePause() {
  if (!voiceAudio) return;
  if (voicePaused) {
    voiceAudio.play().catch(() => {});
    voicePaused = false;
    setVoiceIndicator(true);
    updateVoicePauseIcon(true);
  } else {
    voiceAudio.pause();
    voicePaused = true;
    setVoiceIndicator(false);
    updateVoicePauseIcon(false);
  }
}

function stopVoice() {
  if (voiceAudio) {
    voiceAudio.pause();
    voiceAudio.currentTime = 0;
    voicePaused = false;
    setVoiceIndicator(false);
    updateVoicePauseIcon(false);
  }
}

function updateMusicPauseIcon(isPlaying) {
  const icon = document.getElementById('iconMusicPause');
  if (!icon) return;
  icon.innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function toggleMusicPause() {
  if (musicMuted) return;
  if (musicPaused) {
    musicAudio.play().catch(() => {});
    musicPaused = false;
    updateMusicPauseIcon(true);
  } else {
    musicAudio.pause();
    musicPaused = true;
    updateMusicPauseIcon(false);
  }
}

function setMusicVolume(val) {
  musicAudio.volume = parseFloat(val);
  if (parseFloat(val) === 0) {
    musicMuted = true;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
       <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    musicAudio.pause();
    updateMusicPauseIcon(false);
  } else if (musicMuted) {
    musicMuted = false;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    musicAudio.play().catch(() => {});
    updateMusicPauseIcon(true);
  }
}

function toggleMusic() {
  musicMuted = !musicMuted;
  const icon   = document.getElementById('iconMusic');
  const slider = document.getElementById('musicVolume');
  if (musicMuted) {
    musicAudio.pause();
    musicPaused = false;
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    if (slider) slider.value = 0;
    updateMusicPauseIcon(false);
  } else {
    musicAudio.volume = 0.4;
    musicAudio.play().catch(() => {});
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    if (slider) slider.value = 0.4;
    updateMusicPauseIcon(true);
  }
}

// ── STATE ────────────────────────────────────────────────────
let currentPage = 0;
let animating   = false;

const bookCard  = document.getElementById('bookCard');
const navDotsEl = document.getElementById('navDots');
const navLeft   = document.getElementById('navLeft');
const navRight  = document.getElementById('navRight');

function withDropCap(text) {
  const t = text.trimStart();
  if (!t.length) return text;
  return `<span class="drop-cap">${t.charAt(0)}</span>${t.slice(1)}`;
}

function buildDots() {
  navDotsEl.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    navDotsEl.appendChild(d);
  });
}

function updateArrows() {
  const p = pages[currentPage];
  navLeft.classList.toggle('hidden',  !bookOpened || currentPage <= 0);
  navRight.classList.toggle('hidden', !bookOpened || p.type === 'end' || currentPage >= pages.length - 1);
}

function buildPageElement(p) {
  const el = document.createElement('div');

  if (p.type === 'cover') {
    el.className = 'cover-page';
    const isMobile = window.innerWidth <= 767;
    const imgSrc = (isMobile && p.coverMobileImg) ? p.coverMobileImg : p.coverImg;

    el.innerHTML = imgSrc
      ? `<img src="${imgSrc}" alt="Portada: ${p.title}">`
      : `<div class="cover-bg-placeholder">🎵</div>`;
    el.innerHTML += `
      <div class="cover-overlay">
        <h1>${p.title}</h1>
        <p class="author">${p.author}</p>
      </div>`;
    el.onclick = openBook;

  } else if (p.type === 'end') {
    el.className = 'end-page';
    el.innerHTML = `
      <div class="end-page-content">
        <div class="ornament">✦ ✦ ✦</div>
        <h2>Fin de la historia</h2>
        <p>LaIAmusical</p>
        <button class="back-btn" onclick="goToPage(0)">Volver al inicio</button>
      </div>`;
    stopAllAudio();

  } else {
    const imgHtml = p.illustrationSrc
      ? `<img src="${p.illustrationSrc}" alt="${p.chapterTitle || 'Ilustración página ' + p.pageNum}">`
      : `<div class="img-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 15l5-5 4 4 3-3 6 6"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
          </svg>
         </div>`;

    el.className = 'story-page';
    el.innerHTML = `
      <div class="page-illustration">${imgHtml}</div>
      <div class="page-text-section">
        <div class="chapter-label">${p.chapterTitle || `Capítulo ${p.pageNum}`}</div>
        <div class="page-text"><p>${withDropCap(p.text)}</p></div>
        <div class="page-number">${p.pageNum}</div>
      </div>
      <div class="swipe-hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        Desliza para pasar
      </div>`;
  }

  return el;
}

function renderBook(direction) {
  const p = pages[currentPage];

  const headerTitle = p.type === 'cover'
    ? p.title
    : p.type === 'end'
      ? 'Fin de la historia'
      : (p.chapterTitle || `Capítulo ${p.pageNum}`);
  const headerEl = document.querySelector('.book-title-header');
  if (headerEl) headerEl.textContent = headerTitle;

  const newEl = buildPageElement(p);

  if (direction && bookOpened) {
    const inClass  = direction === 'forward' ? 'anim-in-forward'  : 'anim-in-backward';
    const outClass = direction === 'forward' ? 'anim-out-forward' : 'anim-out-backward';

    newEl.style.position = 'absolute';
    newEl.style.inset    = '0';
    newEl.style.zIndex   = '2';

    const oldEl = bookCard.firstElementChild;
    if (oldEl && !oldEl.classList.contains('page-shadow-overlay')) {
      oldEl.style.position = 'absolute';
      oldEl.style.inset    = '0';
      oldEl.style.zIndex   = '1';
      oldEl.classList.add(outClass);
    }

    const shadow = document.createElement('div');
    shadow.className = 'page-shadow-overlay' + (direction === 'backward' ? ' backward' : '');
    shadow.style.zIndex = '5';
    bookCard.appendChild(shadow);

    setTimeout(() => {
      bookCard.appendChild(newEl);
      newEl.classList.add(inClass);
    }, 80);

    setTimeout(() => {
      while (bookCard.children.length > 1) bookCard.removeChild(bookCard.firstChild);
      newEl.style.position = '';
      newEl.style.inset    = '';
      newEl.style.zIndex   = '';
    }, 520);

  } else {
    bookCard.innerHTML = '';
    bookCard.appendChild(newEl);
  }

  buildDots();
  updateArrows();
}

function openBook() {
  if (!bookOpened) {
    bookOpened = true;
    document.getElementById('openHintBadge').classList.add('hidden');
    document.getElementById('audioBar').classList.add('visible');
    startMusic();
  }
  nextPage();
}

function nextPage() {
  if (currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward');
}
function prevPage() {
  if (currentPage > 0) goToPage(currentPage - 1, 'backward');
}

function goToPage(target, dir) {
  if (animating || target === currentPage || target < 0 || target >= pages.length) return;
  const forward = dir ? dir === 'forward' : target > currentPage;
  animating = true;
  stopAllAudio();
  currentPage = target;
  renderBook(forward ? 'forward' : 'backward');
  setTimeout(() => {
    animating = false;
    const p = pages[currentPage];
    if (p && p.voiceSrc) playPageVoice(p.voiceSrc);
  }, 540);
}

// ── SWIPE GESTURES ───────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;

bookCard.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

bookCard.addEventListener('touchend', e => {
  if (!bookOpened) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 45) {
    if (dx < 0) nextPage();
    else        prevPage();
  }
}, { passive: true });

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
});

// ── INIT ─────────────────────────────────────────────────────
renderBook();
</script>

    /* ── Móviles: pegado al borde inferior, respetando el "safe area"

    /* Pantallas muy pequeñas (≤360px) */
    @media (max-width: 360px) {
        #backToRoomBtn {

            bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            padding: 10px 12px;

            gap: 6px;

    }
</style>
<button id="backToRoomBtn" onclick="goBackToRoom()">
    <i class="fas fa-arrow-left"></i>
    <span id="backToRoomLabel">Volver a la sala</span>
</button>
<script>
(function () {
    // Asegura que el viewport respete el "notch"/barra de gestos en iPhone,
    // para que env(safe-area-inset-bottom) funcione aunque la página no
    // tuviera viewport-fit=cover configurado en su <meta viewport>.
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp && vp.content.indexOf('viewport-fit') === -1) {
        vp.content = vp.content + ', viewport-fit=cover';
    } else if (!vp) {
        var m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        document.head.appendChild(m);
    }

    var returnUrl   = sessionStorage.getItem('lastRoomUrl');
    var returnTopic = sessionStorage.getItem('lastRoomTopicLabel') || sessionStorage.getItem('lastRoomTopic');
    var btn   = document.getElementById('backToRoomBtn');
    var label = document.getElementById('backToRoomLabel');

    // Solo mostrar el botón si llegamos aquí desde reproductor.html
    if (returnUrl) {
        btn.style.display = 'flex';
        if (returnTopic) {
            label.textContent = 'Volver a ' + returnTopic;
        }
    }

    window.goBackToRoom = function () {
        window.location.href = returnUrl || 'reproductor.html';
    };
})();
</script>
